name: e2e

# Launches the built app and drives it through the WebDriver protocol (`tauri-driver` over
# WebKitWebDriver), so a flow that compiles, passes every unit test and still does not work in the
# real window fails somewhere. The flows are in `e2e/run.js`. Linux only for now, since that is the
# one platform tauri-driver drives without a matching browser driver to install, and weekly plus on
# demand rather than on every push, because it builds the whole app.
on:
    schedule:
        # Wednesdays 07:00 UTC, between mutation.yml (Monday) and scheduled-audit.yml (Thursday).
        - cron: "0 7 * * 3"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: e2e
    cancel-in-progress: false

jobs:
    e2e:
        name: End-to-end flows (Linux)
        runs-on: ubuntu-26.04
        timeout-minutes: 60
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            # No version input. The pnpm version comes from package.json's packageManager field.
            - name: Setup pnpm
              uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 26.5.0
                  cache: pnpm

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable (2026-06-30)
              with:
                  toolchain: 1.99.1

            # The build dependencies release.yml installs, plus the WebKit WebDriver tauri-driver
            # talks to and a display for the window. FFmpeg makes the video the import flow adds and
            # its thumbnail, and the GStreamer plugins are what WebKitGTK plays a WebM with. The tools
            # give the plugin list the flow step prints.
            - name: Install Linux dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
                      librsvg2-dev patchelf xdg-utils webkitgtk-webdriver xvfb ffmpeg \
                      gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-tools

            - name: Cache Rust build
              uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
              with:
                  workspaces: src-tauri

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # Pinned like every other tool the workflows install, so the driver that runs is the one
            # last reviewed.
            - name: Install tauri-driver
              run: cargo install tauri-driver@2.1.0 --locked

            # A debug build embeds the frontend bundle the same way a release does, and skips the
            # installers this job has no use for.
            - name: Build the app
              run: pnpm tauri build --debug --no-bundle

            # Empty config, data and cache directories, so every run is a first launch with no
            # library and no database. The same WebKit switches as the release webview check, which
            # otherwise fails to paint under Xvfb.
            #
            # A native dialog is out of WebDriver's reach, so the KAVYNEX_E2E_* variables name what
            # each one answers, which a debug build reads instead of opening it (commands/dialog.rs).
            # The app inherits them through tauri-driver. The video is one second of a test pattern,
            # made here rather than kept in the repository.
            #
            # GST_DEBUG=2 puts GStreamer's warnings and errors in the log, since a video the player
            # cannot play otherwise reaches the flow as a bare media error. The plugin list before
            # the flows says which demuxers, decoders and sinks the runner has.
            - name: Run the end-to-end flows
              env:
                  WEBKIT_DISABLE_COMPOSITING_MODE: "1"
                  WEBKIT_DISABLE_DMABUF_RENDERER: "1"
                  GST_DEBUG: "2"
              run: |
                  gst-inspect-1.0 2>/dev/null | grep -i -E "matroska|vp8|vpx|appsink|videoconvert|gl" || true

                  profile=$(mktemp -d)
                  export XDG_CONFIG_HOME="$profile/config"
                  export XDG_DATA_HOME="$profile/data"
                  export XDG_CACHE_HOME="$profile/cache"

                  binary="$PWD/src-tauri/target/debug/kavynex"

                  mkdir -p "$profile/library" "$profile/files"
                  ffmpeg -loglevel error -f lavfi -i testsrc=duration=1:size=160x120:rate=10 \
                      -c:v libvpx -pix_fmt yuv420p "$profile/files/e2e-clip.webm"
                  export KAVYNEX_E2E_PICK_FOLDER="$profile/library"
                  export KAVYNEX_E2E_PICK_FILE="$profile/files/e2e-clip.webm"
                  export KAVYNEX_E2E_SAVE_FILE="$profile/files/exported.db"

                  if [ ! -x "$binary" ]; then
                      echo "::error::no built kavynex binary was found at $binary" >&2
                      exit 1
                  fi

                  # A display for the window, and the driver that opens it, both stopped on exit.
                  Xvfb :99 -screen 0 1280x800x24 &
                  display_server=$!
                  export DISPLAY=:99

                  tauri-driver --port 4444 &
                  driver=$!
                  trap 'kill "$driver" "$display_server"' EXIT

                  for _ in $(seq 1 50); do
                      curl -sf http://127.0.0.1:4444/status >/dev/null && break
                      sleep 0.2
                  done

                  node e2e/run.js "$binary"

    # Like scheduled-audit.yml and mutation.yml, a failing scheduled run opens (or comments on) a
    # tracking issue, since the email GitHub sends is easy to miss. Results are checked explicitly
    # rather than with `failure()`, which does not match a job cancelled by its own timeout, and
    # under `!cancelled()` rather than `always()`, which is true only when the whole run was
    # cancelled, by hand. A job past its `timeout-minutes` is cancelled alone and still alerts.
    alert-on-failure:
        name: Open an issue on failure
        needs: [e2e]
        if: "!cancelled() && (needs.e2e.result == 'failure' || needs.e2e.result == 'cancelled')"
        runs-on: ubuntu-26.04
        timeout-minutes: 10
        permissions:
            issues: write
        steps:
            - name: Open or update the tracking issue
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  # No checkout here, so `gh issue` needs the repository named.
                  GH_REPO: ${{ github.repository }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              run: |
                  TITLE="End-to-end flows failed"
                  BODY="The end-to-end run failed: a flow in e2e/run.js did not get through the real window, or the build before it broke. Review the run: $RUN_URL"
                  EXISTING=$(gh issue list --state open --search "$TITLE in:title" \
                      --json number,title \
                      --jq "[.[] | select(.title == \"$TITLE\")] | .[0].number // empty")
                  if [ -n "$EXISTING" ]; then
                      gh issue comment "$EXISTING" --body "$BODY"
                  else
                      gh issue create --title "$TITLE" --body "$BODY"
                  fi

    # The other half. A green run closes the issue the job above opened, so an open one always means
    # the flows are failing now.
    close-on-success:
        name: Close the tracking issue on a green run
        needs: [e2e]
        if: needs.e2e.result == 'success'
        runs-on: ubuntu-26.04
        timeout-minutes: 10
        permissions:
            issues: write
        steps:
            - name: Close the tracking issue if one is open
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GH_REPO: ${{ github.repository }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              run: |
                  TITLE="End-to-end flows failed"
                  NUMBER=$(gh issue list --state open --search "$TITLE in:title" \
                      --json number,title \
                      --jq "[.[] | select(.title == \"$TITLE\")] | .[0].number // empty")

                  if [ -n "$NUMBER" ]; then
                      gh issue close "$NUMBER" \
                          --comment "A later run of this workflow completed green: $RUN_URL"
                  fi
