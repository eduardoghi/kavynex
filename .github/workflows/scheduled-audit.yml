name: scheduled-audit

# The dependency audits in ci.yml only run on push/pull_request, so a new advisory published
# against an already-vendored dependency goes unnoticed until the next commit lands, which, on a
# quiet week for a solo project, can be a long time. This runs the same JS (osv.dev) and Rust
# (cargo-audit/cargo-deny) gates on a weekly schedule against the committed lockfiles, so a freshly
# disclosed advisory surfaces on its own rather than waiting for the next push. Also dispatchable by
# hand. The gates and their pins are kept identical to ci.yml. A red run here means the same thing.
on:
    schedule:
        # Thursdays 07:00 UTC, offset from mutation.yml's Monday run so the two never contend.
        - cron: "0 7 * * 4"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: scheduled-audit
    cancel-in-progress: false

jobs:
    js-advisories:
        name: JS advisories (osv.dev)
        # Pinned rather than `-latest` for the same reason as every other job in the repo: `-latest`
        # silently moves to a new OS major (the 2026-07-14 run already saw it for macOS).
        runs-on: ubuntu-26.04
        timeout-minutes: 30
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            # No version input: the pnpm version comes from package.json's packageManager field, so
            # this and local Corepack install the same pinned pnpm.
            - name: Setup pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  # Kept in sync with ci.yml: the Node major @types/node targets (26).
                  node-version: 26.5.0
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # Same gate as ci.yml: fail on a high/critical advisory in the production tree, queried
            # against osv.dev (see scripts/check-js-advisories.js).
            - name: Audit production JS dependencies
              run: pnpm run advisories:check

            # Also re-check production JS licenses weekly, mirroring ci.yml. ci.yml only runs this on
            # push/PR, so a license change in a re-published version of an already-approved package
            # (rare, but possible) would otherwise go unnoticed until the next commit lands.
            - name: Check production JS licenses
              run: pnpm licenses:check

            # Dev tree too, non-blocking, exactly as in ci.yml: a dev-only advisory should surface
            # in the logs without gating, since it never ships in a release artifact.
            - name: Audit dev JS dependencies (non-blocking)
              continue-on-error: true
              run: pnpm run advisories:check --dev

    rust-advisories:
        name: Cargo audit and deny
        runs-on: ubuntu-26.04
        timeout-minutes: 30
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            # Runs the duplicate-version report at the end of this job. Pinned like every other
            # toolchain here. No pnpm setup or install: the report script is dependency-free.
            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 26.5.0

            - name: Install Rust toolchain
              # Pinned to rust-toolchain.toml's version, like ci.yml.
              uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable (2026-06-30)
              with:
                  toolchain: 1.99.0

            # Pin the tool version (keep in sync with ci.yml/release.yml). cargo-audit still checks
            # against today's RustSec advisory database, which it downloads at run time, so pinning
            # the tool costs nothing in freshness while keeping the run reproducible.
            - name: Install cargo-audit
              run: cargo install cargo-audit@0.22.2 --locked

            # Same flags as ci.yml's audit job. See its comments for why each ignore/deny is set the
            # way it is (the GTK3/unic-* unmaintained tree, the yanked spin via sqlx, RUSTSEC-2024-0429,
            # the zip 4 advisories via tauri-plugin-updater).
            - name: Audit Rust dependencies
              run: >
                  cargo audit --file src-tauri/Cargo.lock
                  --deny unsound
                  --ignore RUSTSEC-2024-0429
                  --ignore RUSTSEC-2026-0367
                  --ignore RUSTSEC-2026-0368
                  --ignore RUSTSEC-2026-0369

            - name: Install cargo-deny
              run: cargo install cargo-deny@0.20.2 --locked

            - name: Check licenses, sources, bans and advisories
              run: cargo deny --manifest-path src-tauri/Cargo.toml check licenses bans sources advisories

            # The duplicate-version count on this run's summary page. See ci.yml's step of the same
            # name for why it is a second cargo-deny invocation and why it never fails the job. It
            # belongs here as much as there: this workflow's whole purpose is surfacing what decays
            # while nothing changes in the repository, and dependency bloat is exactly that. A
            # Dependabot bump can add a duplicate without a single line of this project's code
            # moving, so a weekly reading is the one that shows the drift.
            - name: Report duplicate dependency versions
              run: |
                  cargo deny --manifest-path src-tauri/Cargo.toml --format json check bans \
                      2> deny-bans.json
                  node scripts/summarize-cargo-deny-bans.js deny-bans.json >> "$GITHUB_STEP_SUMMARY"

    # The third thing that decays while nothing in this repository changes is yt-dlp's output
    # format, which the two jobs above cannot see.
    #
    # Every other external input here is pinned: the toolchain, Node, the runner images, every
    # action by SHA, every `cargo install` by version. yt-dlp is the structural exception and cannot
    # be pinned: it is a system binary resolved from PATH (services/binaries.rs), whatever version
    # the user's package manager last installed. `models/yt_dlp.rs` deserializes its
    # `--dump-single-json`, and every test covering that reads a committed fixture, which passes
    # forever no matter what upstream does.
    #
    # WHAT THIS JOB DOES NOT DO, since the obvious reading of its name is the wrong one. It does not
    # check the contract. That needs a real YouTube fetch, and it was tried here first: the test
    # already exists (`live_yt_dlp_output_still_matches_the_committed_fixture`) and is already
    # written to run unattended. On a GitHub runner YouTube answers "Sign in to confirm you're not a
    # bot", because runners are datacenter IPs, so the test skipped and the job went green having
    # verified nothing. Measured, not assumed: run 31979578316.
    #
    # A non-YouTube extractor was the next idea and does not work either. The fields that break the
    # app (`vcodec`, `acodec`, `height`, `resolution`, `comment_count`) are generic InfoDict *keys*
    # but are only populated by extractors doing real format enumeration. yt-dlp's generic extractor
    # against a locally served file returns one empty format, so a test against it would pass forever
    # regardless of upstream. Which is worse than no test.
    #
    # So the verification stays local, where it works, and what is automated is the part that was
    # actually missing. The gap was never "this cannot be checked". It is that checking depended on
    # the maintainer noticing yt-dlp had moved. This job notices. It compares the version the fixture
    # records against yt-dlp's latest release and opens an issue when they differ, which needs no
    # YouTube, no third-party site and no network beyond the GitHub API this workflow already uses.
    yt-dlp-fixture-freshness:
        name: yt-dlp fixture freshness
        runs-on: ubuntu-26.04
        timeout-minutes: 10
        permissions:
            contents: read
            # Self-contained on purpose: it opens and closes its own tracker rather than routing
            # through the shared alert/close jobs below. Those key off a job *failing*, and a new
            # yt-dlp release is not a failure of anything. Wiring it in would have meant either a red
            # run every couple of weeks until the fixture is refreshed (the "trains you to ignore
            # it" outcome this repository keeps arguing against) or threading a third result through
            # two conditions that exist to stay identical to mutation.yml's.
            issues: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            # Compared for *equality*, not ordering. yt-dlp versions are dates (`2026.07.04`) with
            # occasional point releases (`2026.07.04.1`), and the question here is not "is the
            # fixture older" but "was it captured from something other than what a user installs
            # today". Any difference means refresh it, which sidesteps date parsing entirely.
            #
            # The version is read from `_captured_from_yt_dlp` in the fixture rather than from the
            # prose in its `_comment`, which states the same fact in a sentence: a reworded comment
            # would break this silently, and this file already carries two other gates whose whole
            # reason for existing is that a prose-and-code pair drifted.
            - name: Compare the fixture's yt-dlp version against the latest release
              id: freshness
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  CAPTURED=$(node -p "require('./src-tauri/tests/fixtures/yt-dlp-metadata-youtube.json')._captured_from_yt_dlp")
                  LATEST=$(gh api repos/yt-dlp/yt-dlp/releases/latest --jq '.tag_name')

                  if [ -z "$CAPTURED" ] || [ "$CAPTURED" = "undefined" ]; then
                      echo "::error::the fixture has no _captured_from_yt_dlp version to compare against"
                      exit 1
                  fi

                  echo "captured=$CAPTURED" >> "$GITHUB_OUTPUT"
                  echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
                  echo "Fixture captured from $CAPTURED; yt-dlp latest is $LATEST."

                  if [ "$CAPTURED" = "$LATEST" ]; then
                      echo "stale=false" >> "$GITHUB_OUTPUT"
                      echo "### yt-dlp fixture: current ($CAPTURED)" >> "$GITHUB_STEP_SUMMARY"
                  else
                      echo "stale=true" >> "$GITHUB_OUTPUT"
                      echo "### yt-dlp fixture: behind" >> "$GITHUB_STEP_SUMMARY"
                      echo "Captured from \`$CAPTURED\`, latest release is \`$LATEST\`. Run the local contract check." >> "$GITHUB_STEP_SUMMARY"
                  fi

            # Matched exactly rather than by substring, like the close job below: `--search` is full
            # text, so a prefix match could comment on an unrelated issue opened by hand.
            - name: Open or update the tracking issue
              if: steps.freshness.outputs.stale == 'true'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GH_REPO: ${{ github.repository }}
                  CAPTURED: ${{ steps.freshness.outputs.captured }}
                  LATEST: ${{ steps.freshness.outputs.latest }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              run: |
                  TITLE="yt-dlp has released a version the fixture was not captured from"
                  BODY=$(printf '%s' \
                      "yt-dlp \`$LATEST\` is out; \`src-tauri/tests/fixtures/yt-dlp-metadata-youtube.json\` was captured from \`$CAPTURED\`. " \
                      "This is a reminder, not a failure: nothing is known to be broken, and the fixture-based tests still pass either way, which is exactly why this needs saying out loud. " \
                      "Run the contract check locally, where YouTube answers (CI gets a bot check):"$'\n\n' \
                      '```'$'\n' \
                      "cargo test --manifest-path src-tauri/Cargo.toml -- --ignored live_yt_dlp_output"$'\n' \
                      '```'$'\n\n' \
                      "If it passes, refresh \`_captured_from_yt_dlp\` to \`$LATEST\` and this issue closes itself on the next run. If it fails, yt-dlp's output moved: update the fixture and probably \`models/yt_dlp.rs\` with it. Run: $RUN_URL")

                  EXISTING=$(gh issue list --state open --search "$TITLE in:title" \
                      --json number,title \
                      --jq "[.[] | select(.title == \"$TITLE\")] | .[0].number // empty")

                  if [ -n "$EXISTING" ]; then
                      gh issue comment "$EXISTING" --body "$BODY"
                  else
                      gh issue create --title "$TITLE" --body "$BODY"
                  fi

            - name: Close the tracking issue once the fixture caught up
              if: steps.freshness.outputs.stale == 'false'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GH_REPO: ${{ github.repository }}
                  CAPTURED: ${{ steps.freshness.outputs.captured }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              run: |
                  TITLE="yt-dlp has released a version the fixture was not captured from"
                  NUMBER=$(gh issue list --state open --search "$TITLE in:title" \
                      --json number,title \
                      --jq "[.[] | select(.title == \"$TITLE\")] | .[0].number // empty")

                  if [ -n "$NUMBER" ]; then
                      echo "Closing #$NUMBER ($TITLE)"
                      gh issue close "$NUMBER" \
                          --comment "The fixture is now captured from \`$CAPTURED\`, which is yt-dlp's latest release: $RUN_URL"
                  fi

    # The SQLite the app ships is compiled into libsqlite3-sys, a C library RustSec does not track, so
    # neither cargo-audit nor cargo-deny says when it falls behind. The app opens database files that
    # come from outside (Import database, the external mirror), so SQLite's parser is in front of
    # untrusted input. This compares the bundled version with SQLite's latest release by major.minor
    # and keeps a tracking issue open while they differ, the way the yt-dlp job above does. The bump
    # itself arrives with sqlx, which pins libsqlite3-sys.
    sqlite-freshness:
        name: Bundled SQLite freshness
        runs-on: ubuntu-26.04
        timeout-minutes: 10
        permissions:
            contents: read
            issues: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Compare the bundled SQLite with the latest release
              id: freshness
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  CRATE_VERSION=$(awk '/^name = "libsqlite3-sys"$/ { getline; gsub(/version = |"/, ""); print; exit }' src-tauri/Cargo.lock | tr -d '\r')

                  if [ -z "$CRATE_VERSION" ]; then
                      echo "::error::libsqlite3-sys is not in src-tauri/Cargo.lock"
                      exit 1
                  fi

                  WORK=$(mktemp -d)
                  curl --fail --silent --location \
                      "https://static.crates.io/crates/libsqlite3-sys/libsqlite3-sys-$CRATE_VERSION.crate" \
                      | tar -xz -C "$WORK"
                  BUNDLED=$(grep -m1 '#define SQLITE_VERSION ' "$WORK/libsqlite3-sys-$CRATE_VERSION/sqlite3/sqlite3.h" | cut -d '"' -f 2)
                  LATEST=$(gh api repos/sqlite/sqlite/tags --paginate --jq '.[].name' \
                      | grep -E '^version-[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^version-//' | sort -V | tail -n 1)

                  if [ -z "$BUNDLED" ] || [ -z "$LATEST" ]; then
                      echo "::error::could not read the bundled ($BUNDLED) or the latest ($LATEST) SQLite version"
                      exit 1
                  fi

                  {
                      echo "bundled=$BUNDLED"
                      echo "latest=$LATEST"
                      echo "crate=$CRATE_VERSION"
                  } >> "$GITHUB_OUTPUT"

                  if [ "${BUNDLED%.*}" = "${LATEST%.*}" ]; then
                      echo "stale=false" >> "$GITHUB_OUTPUT"
                      echo "### Bundled SQLite: current ($BUNDLED)" >> "$GITHUB_STEP_SUMMARY"
                  else
                      echo "stale=true" >> "$GITHUB_OUTPUT"
                      echo "### Bundled SQLite: behind" >> "$GITHUB_STEP_SUMMARY"
                      echo "libsqlite3-sys \`$CRATE_VERSION\` bundles SQLite \`$BUNDLED\`; the latest release is \`$LATEST\`." >> "$GITHUB_STEP_SUMMARY"
                  fi

            - name: Open or update the tracking issue
              if: steps.freshness.outputs.stale == 'true'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GH_REPO: ${{ github.repository }}
                  BUNDLED: ${{ steps.freshness.outputs.bundled }}
                  LATEST: ${{ steps.freshness.outputs.latest }}
                  CRATE: ${{ steps.freshness.outputs.crate }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              run: |
                  TITLE="The bundled SQLite is behind the latest release"
                  BODY=$(printf '%s' \
                      "libsqlite3-sys \`$CRATE\` compiles SQLite \`$BUNDLED\` into the app, and SQLite \`$LATEST\` is out. " \
                      "RustSec does not track SQLite, so this is the only place that says so. The app opens database files from outside (Import database, the external mirror). " \
                      "Check SQLite's release notes for security fixes, and bump sqlx when a release of it moves libsqlite3-sys forward. Run: $RUN_URL")

                  EXISTING=$(gh issue list --state open --search "$TITLE in:title" \
                      --json number,title \
                      --jq "[.[] | select(.title == \"$TITLE\")] | .[0].number // empty")

                  if [ -n "$EXISTING" ]; then
                      gh issue comment "$EXISTING" --body "$BODY"
                  else
                      gh issue create --title "$TITLE" --body "$BODY"
                  fi

            - name: Close the tracking issue once SQLite caught up
              if: steps.freshness.outputs.stale == 'false'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GH_REPO: ${{ github.repository }}
                  BUNDLED: ${{ steps.freshness.outputs.bundled }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              run: |
                  TITLE="The bundled SQLite is behind the latest release"
                  NUMBER=$(gh issue list --state open --search "$TITLE in:title" \
                      --json number,title \
                      --jq "[.[] | select(.title == \"$TITLE\")] | .[0].number // empty")

                  if [ -n "$NUMBER" ]; then
                      gh issue close "$NUMBER" \
                          --comment "The bundled SQLite is now \`$BUNDLED\`, in step with the latest release: $RUN_URL"
                  fi

    # The cargo tools the workflows install are pinned to exact versions (`cargo install <tool>@<ver>`,
    # kept consistent by scripts/verify-rust-toolchain.js), and Dependabot cannot see those lines. An
    # old cargo-audit or cargo-deny can stop parsing the advisory database after a format change, and
    # both gate every release. This keeps one tracking issue open while any pin is behind the
    # latest release on crates.io, like the two jobs above.
    cargo-tool-pins:
        name: Pinned cargo tools freshness
        runs-on: ubuntu-26.04
        timeout-minutes: 10
        permissions:
            contents: read
            issues: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Compare each pinned tool with its latest release
              id: pins
              run: |
                  PINS=$(grep -rhoE 'cargo install [a-z0-9_-]+@[0-9][0-9A-Za-z.+-]*' .github/workflows \
                      | sed 's/^cargo install //' | sort -u)

                  if [ -z "$PINS" ]; then
                      echo "::error::no pinned cargo tool was found in .github/workflows"
                      exit 1
                  fi

                  BEHIND=""

                  for pin in $PINS; do
                      tool=${pin%@*}
                      pinned=${pin#*@}
                      latest=$(curl --fail --silent --show-error \
                          --user-agent "kavynex-scheduled-audit (github.com/${GITHUB_REPOSITORY})" \
                          "https://crates.io/api/v1/crates/$tool" | jq -r '.crate.max_stable_version')

                      if [ -z "$latest" ] || [ "$latest" = "null" ]; then
                          echo "::error::could not read the latest release of $tool from crates.io"
                          exit 1
                      fi

                      echo "$tool pinned at $pinned, latest $latest"

                      if [ "$pinned" != "$latest" ]; then
                          BEHIND="$BEHIND $tool $pinned -> $latest;"
                      fi
                  done

                  if [ -n "$BEHIND" ]; then
                      echo "stale=true" >> "$GITHUB_OUTPUT"
                      echo "behind=$BEHIND" >> "$GITHUB_OUTPUT"
                      echo "### Pinned cargo tools: behind ($BEHIND)" >> "$GITHUB_STEP_SUMMARY"
                  else
                      echo "stale=false" >> "$GITHUB_OUTPUT"
                      echo "### Pinned cargo tools: current" >> "$GITHUB_STEP_SUMMARY"
                  fi

            - name: Open or update the tracking issue
              if: steps.pins.outputs.stale == 'true'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GH_REPO: ${{ github.repository }}
                  BEHIND: ${{ steps.pins.outputs.behind }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              run: |
                  TITLE="Pinned cargo tools are behind their latest release"
                  BODY="Behind:$BEHIND Bump the version in every workflow that installs it (scripts/verify-rust-toolchain.js fails until they agree). Run: $RUN_URL"

                  EXISTING=$(gh issue list --state open --search "$TITLE in:title" \
                      --json number,title \
                      --jq "[.[] | select(.title == \"$TITLE\")] | .[0].number // empty")

                  if [ -n "$EXISTING" ]; then
                      gh issue comment "$EXISTING" --body "$BODY"
                  else
                      gh issue create --title "$TITLE" --body "$BODY"
                  fi

            - name: Close the tracking issue once every pin is current
              if: steps.pins.outputs.stale == 'false'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GH_REPO: ${{ github.repository }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              run: |
                  TITLE="Pinned cargo tools are behind their latest release"
                  NUMBER=$(gh issue list --state open --search "$TITLE in:title" \
                      --json number,title \
                      --jq "[.[] | select(.title == \"$TITLE\")] | .[0].number // empty")

                  if [ -n "$NUMBER" ]; then
                      gh issue close "$NUMBER" --comment "Every pinned cargo tool is current: $RUN_URL"
                  fi

    # GitHub emails the maintainer when a scheduled run fails, but that is an easily-missed inbox
    # signal: the header of this file frames the workflow's whole job as "surfacing" a new
    # advisory, and an email alone barely does that. Open (or comment on) a tracking issue so a
    # failing audit is visible in the repository itself. Runs only when a gate above did not
    # succeed, and only on the schedule/dispatch this workflow already runs on.
    alert-on-failure:
        name: Open an issue on failure
        # The freshness jobs too. They report being behind through issues of their own and go red
        # only when they could not answer at all (an API error, a version they could not read),
        # which used to reach nothing but an email.
        needs: [js-advisories, rust-advisories, yt-dlp-fixture-freshness, sqlite-freshness, cargo-tool-pins]
        # Not `if: failure()`, which is what this said and which does not do what it reads as. A job
        # killed by its own `timeout-minutes` is marked **cancelled**, not failed, and `failure()`
        # does not match cancelled, so the alert is skipped on exactly the run where the gate
        # stopped producing a verdict. That is the worse half of the failure: a gate that fails
        # loudly is merely broken, while a gate that goes silent reads as green.
        #
        # It is not hypothetical here. Both jobs above `cargo install` two tools from source with no
        # build cache under a 30-minute ceiling, which is the shape that hits a timeout first. And it
        # already happened once in this repository, to mutation.yml's identical job on 2026-07-27.
        # That job's condition was fixed then and this one was not, even though this file was
        # revisited afterwards for the GH_REPO half of the same lesson (see below).
        #
        # So the dependency results are checked explicitly rather than leaning on a status function.
        # `always()` is what lets this run at all once a dependency is cancelled. The consequence is
        # that cancelling the run by hand also opens an issue, which is the right direction to err.
        # Kept identical to mutation.yml's condition on purpose: the two must not drift again.
        if: >
            always() &&
            (needs.js-advisories.result == 'failure' || needs.js-advisories.result == 'cancelled' ||
             needs.rust-advisories.result == 'failure' || needs.rust-advisories.result == 'cancelled' ||
             needs.yt-dlp-fixture-freshness.result == 'failure' || needs.yt-dlp-fixture-freshness.result == 'cancelled' ||
             needs.sqlite-freshness.result == 'failure' || needs.sqlite-freshness.result == 'cancelled' ||
             needs.cargo-tool-pins.result == 'failure' || needs.cargo-tool-pins.result == 'cancelled')
        runs-on: ubuntu-26.04
        timeout-minutes: 10
        permissions:
            issues: write
        steps:
            - name: Open or update the tracking issue
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  # No checkout step here either, so `gh issue` has no git remote to resolve the
                  # repository from and would fail before opening anything. Proven by the mutation
                  # workflow's identical job, which failed exactly that way the first time it ever
                  # ran. This one has the same shape and has never fired, so it would have too.
                  GH_REPO: ${{ github.repository }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              run: |
                  TITLE="Scheduled dependency audit failed"
                  BODY="The weekly scheduled dependency audit failed: a JS advisory/license or a Rust cargo-audit/cargo-deny gate is red, or one of the freshness checks could not answer. Review the run: $RUN_URL"
                  # Matched exactly, like the close job below, so an issue opened by hand about the
                  # same subject is not commented on.
                  EXISTING=$(gh issue list --state open --search "$TITLE in:title" \
                      --json number,title \
                      --jq "[.[] | select(.title == \"$TITLE\")] | .[0].number // empty")
                  if [ -n "$EXISTING" ]; then
                      gh issue comment "$EXISTING" --body "$BODY"
                  else
                      gh issue create --title "$TITLE" --body "$BODY"
                  fi

    # The other half of the job above. It only ever opened or commented, so a tracking issue outlived
    # the advisory it described and stayed open across every later green run, at which point "there
    # is an open alert issue" stops meaning "there is a failing gate now", and the next real advisory
    # arrives as a comment on an issue that already reads as known.
    #
    # Kept identical in shape to mutation.yml's, which is where the full reasoning lives, and for the
    # same reason the two alert conditions are kept identical: these must not drift again.
    close-on-success:
        name: Close the tracking issue on a green run
        needs: [js-advisories, rust-advisories, yt-dlp-fixture-freshness, sqlite-freshness, cargo-tool-pins]
        if: >
            needs.js-advisories.result == 'success' &&
            needs.rust-advisories.result == 'success' &&
            needs.yt-dlp-fixture-freshness.result == 'success' &&
            needs.sqlite-freshness.result == 'success' &&
            needs.cargo-tool-pins.result == 'success'
        runs-on: ubuntu-26.04
        timeout-minutes: 10
        permissions:
            issues: write
        steps:
            - name: Close the tracking issue if one is open
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  # No checkout step here either, so `gh issue` has no git remote to resolve the
                  # repository from. See the job above.
                  GH_REPO: ${{ github.repository }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              run: |
                  # Matched exactly rather than by substring: `--search` is full text, so a prefix
                  # match could close an unrelated issue opened by hand about the same subject.
                  TITLE="Scheduled dependency audit failed"
                  NUMBER=$(gh issue list --state open --search "$TITLE in:title" \
                      --json number,title \
                      --jq "[.[] | select(.title == \"$TITLE\")] | .[0].number // empty")

                  if [ -n "$NUMBER" ]; then
                      echo "Closing #$NUMBER ($TITLE)"
                      gh issue close "$NUMBER" \
                          --comment "A later run of this workflow completed green: $RUN_URL"
                  fi
