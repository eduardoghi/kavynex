name: mutation

on:
    # Mutation testing is the higher-signal quality gate but too slow to run on every PR, so it
    # runs on a weekly schedule (Mondays 06:00 UTC) and on demand instead of gating each push.
    schedule:
        - cron: "0 6 * * 1"
    workflow_dispatch:

# The run only needs to read the repository.
permissions:
    contents: read

concurrency:
    group: mutation-${{ github.ref }}
    cancel-in-progress: true

jobs:
    mutation:
        name: Mutation testing
        # Pinned rather than `ubuntu-latest`, matching ci.yml's rust job: `-latest` can silently jump
        # an OS major, which would move a mutation score for a reason unrelated to the tests.
        runs-on: ubuntu-26.04
        outputs:
            # "scored" when Stryker reached the end and reported a mutation score, "no-score" when it
            # aborted before producing one. The alert job turns the two into differently-titled
            # issues; see the step that sets this for why the distinction is not cosmetic.
            verdict: ${{ steps.stryker.outputs.verdict }}
        # Generous timeout: a full mutation run is long, and this is a weekly scheduled run rather
        # than a per-PR gate, so a longer wall-clock is fine. A too-tight timeout would also report
        # as a failure indistinguishable from a real mutation-score regression.
        timeout-minutes: 120
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            # No version input: the pnpm version comes from package.json's packageManager
            # field, so CI and local Corepack install the same pinned pnpm.
            - name: Setup pnpm
              uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 26.5.0
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # Stryker exits non-zero when the mutation score falls below thresholds.break in
            # stryker.config.json, so a real regression in test strength fails this scheduled run.
            #
            # It also exits non-zero when it never got that far, and those two are not the same
            # finding. A dry-run timeout (see dryRunTimeoutMinutes in stryker.config.json, raised to
            # 20 after a local run hit the 5-minute default at 6633 mutants without producing any
            # score at all) aborts the run, and so does an install or instrumentation error. Both
            # arrive here as "the mutation job failed", which reads as a loss of test strength while
            # actually meaning the gate stopped answering - the same confusion that let the Rust
            # leg's timeout go unreported on 2026-07-27, one layer up.
            #
            # So the outcome is classified rather than inferred: a run that reported a score leaves a
            # report behind, one that aborted does not. The step still exits with Stryker's own
            # status, so the job's pass/fail is unchanged - this only records *which* kind of
            # non-zero it was. Written before the exit so the output survives a failing step.
            - name: Run mutation testing
              id: stryker
              run: |
                  set +e
                  pnpm test:mutation
                  status=$?
                  set -e

                  if [ -n "$(ls -A reports/mutation 2>/dev/null)" ]; then
                      echo "verdict=scored" >> "$GITHUB_OUTPUT"
                  else
                      echo "verdict=no-score" >> "$GITHUB_OUTPUT"
                  fi

                  exit "$status"

            # Without this the HTML report - the only artifact that says *which* mutants survived -
            # dies with the runner, so triaging a red run means reproducing a ~29-minute local run
            # first. `if: always()` because the failing run is precisely the one worth reading.
            - name: Upload the Stryker report
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: stryker-mutation-report
                  path: reports/mutation
                  retention-days: 30

    # An `exclude_re` entry that stops matching anything is silent, and costly in both directions:
    # the mutant it suppressed comes back and turns this run red for a reason unrelated to the tests,
    # or - the worse case - the function it named was renamed and its real mutant is now unexcluded
    # and unnoticed among the survivors, with nothing in the config to suggest that the entry rather
    # than the tests had gone stale.
    #
    # Two entries in mutants.toml have already died exactly that way, both after a pure extraction
    # moved the code they named, and both were found by someone deciding to check by hand. This is
    # that check, run every time the gate runs.
    #
    # It is a job rather than a step of the shard below, and the reason is the failure mode this
    # whole workflow keeps running into. It used to be `if: strategy.job-index == 0` inside
    # `rust-mutation`, so it lived under that job's 90-minute ceiling - and a job killed by its own
    # `timeout-minutes` is marked *cancelled*, which is exactly how shard 0 died on 2026-07-27. The
    # check would then not have run at all, while nothing distinguished that from having run and
    # passed. The verdict of the following 90 minutes rests on this having happened, so it must be
    # able to answer on its own.
    #
    # It is also nearly free, which is what makes the split obvious in hindsight: `cargo mutants
    # --list` parses the sources and never builds the tree (measured at 0.5s over the 54 files the
    # scope names), so this job needs no apt packages, no build cache and no compile - only
    # `cargo install cargo-mutants` itself, which is the whole of its runtime.
    verify-exclusions:
        name: Verify every mutants.toml exclusion still names a real mutant
        runs-on: ubuntu-26.04
        # Bounded far below the shards' ceiling. Nothing here compiles the crate, so the only thing
        # that takes real time is building cargo-mutants - and a ceiling this low stays a signal
        # instead of a number nothing approaches.
        timeout-minutes: 30
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Install Rust toolchain
              # Pin the exact toolchain (keep in sync with rust-toolchain.toml), matching ci.yml.
              uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable (2026-06-30)
              with:
                  toolchain: 1.96.0

            # Pinned like every other tool install in this repository: an unpinned `cargo install`
            # builds whatever released today, and this must be the same tool the shards below run.
            - name: Install cargo-mutants
              run: cargo install cargo-mutants@27.1.0 --locked

            # Pinned like every other workflow here rather than taking whatever the image
            # preinstalls, which also means verify-node-version.js keeps this declaration in step
            # with .nvmrc for free.
            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 26.5.0

            # `--no-config` is required and is the subtle part: a `--list` that applied the config
            # would already have removed every mutant the exclusions name, so every pattern would
            # read as dead and the gate would be inverted. `--no-config` also drops `examine_globs`,
            # so the scope is passed back in as `--file` arguments generated from that same list -
            # which is why the script emits them rather than the workflow restating them.
            #
            # Read into an array rather than interpolated: two of those globs are directory globs
            # (`db_backup/*.rs`), and an unquoted expansion would have the shell resolve them into
            # several paths, which cargo-mutants rejects because `--file` takes one value.
            # The listing this reads is uploaded below, and that is not decoration. On its first
            # ever run (2026-08-03) this step reported twenty patterns as naming no mutant, and
            # every one of the twenty matched when the same command was reproduced by hand on the
            # same commit with the same pinned cargo-mutants - so the disagreement is between two
            # *listings*, not between the config and the code. Without the listing that produced
            # the verdict there is nothing to compare against, and the only available response to
            # a red run is to delete twenty exclusions on a guess. That is precisely the failure
            # this gate exists to prevent: an exclusion removed is a real mutant silently
            # unexcluded.
            #
            # `set -o pipefail` is not needed here - nothing is piped - but the counts are echoed
            # so a truncated or empty listing is visible in the log itself rather than only inside
            # an artifact somebody has to download.
            - name: Verify every mutants.toml exclusion still names a real mutant
              run: |
                  mapfile -t FILE_ARGS < <(node scripts/verify-mutants-exclusions.js --file-args)
                  echo "Scope: ${#FILE_ARGS[@]} --file arguments."

                  # `--colors never` because this workflow sets CARGO_TERM_COLOR: always, which
                  # cargo-mutants honours even writing to a file - and it colourizes the function
                  # name *inside* each description, so `replace pin_process_start with ()` arrives
                  # with escape sequences between the words. Every exclusion here names a function,
                  # so with colour on they stop matching and the gate reports live exclusions as
                  # dead. That is how this check failed on its first ever run, against twenty-six
                  # patterns that were all fine. The script strips the sequences too; this keeps
                  # the uploaded listing readable for whoever compares it by hand.
                  cargo mutants --manifest-path src-tauri/Cargo.toml --list --no-config \
                      --colors never "${FILE_ARGS[@]}" > mutants-list.txt

                  echo "Listed $(wc -l < mutants-list.txt) mutants."

                  node scripts/verify-mutants-exclusions.js mutants-list.txt

            # Uploaded whether or not the check passed: a green run's listing is the baseline the
            # next red one is read against, and a red run's is the evidence. Small (a line per
            # mutant) and cheap - the job builds nothing.
            - name: Upload the mutant listing
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: mutants-list
                  path: mutants-list.txt
                  retention-days: 30

    rust-mutation:
        name: Rust mutation testing (shard ${{ strategy.job-index }})
        # Pinned like the job above and ci.yml's rust job; see those comments.
        runs-on: ubuntu-26.04
        strategy:
            # One shard failing must not cancel the others: each covers a distinct slice of the
            # mutant list, so the surviving shards still produce a usable verdict for their slice.
            fail-fast: false
            matrix:
                # These values are never read. The shard is derived from `strategy.job-index` /
                # `strategy.job-total` in the run step below, so only the *length* of this list
                # matters: adding or removing an entry changes the shard count with nothing else to
                # keep in step. Spelling the count in two places is what this avoids, and the
                # failure it avoids is silent - a matrix of three against a hardcoded `/4` would
                # simply never run the fourth shard's mutants, and the run would go green.
                #
                # Four since 2026-07-31, and the reasoning is worth keeping because this is the knob
                # to reach for again. The scope was 1234 mutants across three shards on 2026-07-29,
                # whose legs took 68, 75 and 79 minutes against the ceiling below; adding
                # `live_chat_storage.rs` and `thumbnail/redirect.rs` took it to 1383, which puts the
                # slowest leg at roughly 88 - inside the ceiling by a margin that is not one. The
                # alternative was raising the ceiling, and that is the wrong direction: it exists to
                # be a number nothing approaches, and a leg killed by it reports as *cancelled*
                # rather than failed, which is exactly the outcome that went unreported on
                # 2026-07-27. A fourth shard puts each leg back to a quarter of the scope instead.
                #
                # Five since 2026-08-03, and this one is worth reading before reaching for the knob
                # again, because the trigger was not what the paragraph above would predict. Shard 1
                # was killed at 91 minutes and shard 2 finished at 89, while the scope had barely
                # moved - 1454 against the 1450 measured the day before. So nothing grew; the margin
                # the note above already called "not one" simply ran out, and an ordinary swing in
                # runner speed was enough to cross it. The lesson is that a leg sitting within a few
                # minutes of this ceiling is already over it on some future Tuesday, and the reading
                # to act on is the *slowest* leg rather than the average. A fifth shard takes each
                # leg to roughly 291 mutants, which is about 73 minutes at the pace measured today.
                shard: [1, 2, 3, 4, 5]
        # Per shard, not for the whole run. The unsharded job hit exactly this ceiling on
        # 2026-07-27 (run 30256551949) after `examine_globs` grew from ten entries to twenty, and
        # was killed at 2h00m having produced no verdict - the two runs before it took ~56 minutes.
        # The scope is 1450 mutants today (`cargo mutants --list | wc -l`, which applies the config
        # and so counts what a run actually mutates - the same command without it reports 1634), so a
        # quarter of it plus one baseline build sits well inside this, and the ceiling stays low
        # enough to be a real signal rather than a number nothing ever approaches. When a leg starts
        # creeping toward it, add a shard rather than minutes - see the matrix above.
        #
        # That number is what this decision is read against, so it is worth knowing it drifts: it
        # said 1383 until 2026-08-02, when a re-measurement put it at 1450, and 1454 the day after.
        # Five percent does not change the shard count, which is the point of re-measuring rather
        # than assuming either way - and 2026-08-03 showed the other half of that lesson: the shard
        # count needed changing anyway, for pace rather than for scope. Read the slowest leg, not
        # this number alone.
        timeout-minutes: 90
        # Trim debuginfo like ci.yml's Rust job: cargo-mutants rebuilds the tree once per mutant, so
        # keeping the per-build cost down matters more here than anywhere else.
        env:
            CARGO_PROFILE_DEV_DEBUG: "0"
            CARGO_PROFILE_TEST_DEBUG: "0"
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Install Rust toolchain
              # Pin the exact toolchain (keep in sync with rust-toolchain.toml), matching ci.yml.
              uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable (2026-06-30)
              with:
                  toolchain: 1.96.0

            # These apt packages are intentionally unpinned, like ci.yml/release.yml: exact pins on
            # a hosted image go stale as the archive drops old versions and break the build for a
            # reason unrelated to this project; they are dev headers, not shipped in any bundle.
            - name: Install Linux dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf lld
                  # Link with lld instead of the slow default ld.bfd, mirroring ci.yml's Rust job.
                  echo "RUSTFLAGS=-C link-arg=-fuse-ld=lld" >> "$GITHUB_ENV"

            # cache-on-failure is deliberately off here (unlike a normal build job): this job runs
            # cargo-mutants with `--in-place`, and a job-timeout kill (SIGKILL) can leave the working
            # tree mutated mid-run. Saving a cache derived from that mutated tree on a failed/cancelled
            # run is the one interaction worth avoiding; a fresh checkout would re-fingerprint and
            # rebuild the changed files next run, but not persisting a failure-run cache removes the
            # question entirely. A successful run still caches normally.
            #
            # No per-shard cache key: every shard builds the same unmutated tree, so they share one
            # entry rather than storing three near-identical copies against the repository's cache
            # quota. They race to save it and all but one log a benign "already exists".
            - name: Cache Rust build
              uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
              with:
                  workspaces: src-tauri
                  cache-on-failure: "false"

            # Pin the tool version, like ci.yml/release.yml do for cargo-audit and cargo-deny: an
            # unpinned `cargo install` builds whatever the latest release happens to be on the day
            # the schedule fires, so a mutation score could move because the tool changed rather
            # than because the tests did.
            - name: Install cargo-mutants
              run: cargo install cargo-mutants@27.1.0 --locked

            # Mutates only the security-critical modules (see src-tauri/.cargo/mutants.toml's
            # examine_globs): path containment, the library-path guard, the yt-dlp host allow-list,
            # and external-binary resolution. cargo-mutants exits 2 when a mutant survives - a logic
            # change its tests did not catch - which fails this scheduled run, the mutation-level
            # counterpart to Stryker for the frontend. The generous per-mutant timeout keeps a
            # mutation-induced infinite loop from being misreported instead of caught.
            #
            # `--in-place` is required, not a preference: cargo-mutants' default copies only the
            # `src-tauri` package into a scratch dir, but the youtube-handle parity test
            # (utils/validation.rs) `include_str!`s `../shared/youtube-handle-cases.json` from the
            # repo root - a fixture deliberately shared with the TypeScript side. The copy leaves
            # that sibling behind, so the unmutated baseline build fails there ("cargo build failed
            # in an unmutated tree") before a single mutant runs. Testing in the real tree keeps the
            # `../shared` path resolvable. The CI checkout is disposable, so the in-place caveats
            # (no parallel copies; a killed run leaves the tree mutated) do not apply here.
            #
            # No explicit `--locked` here, unlike every other cargo invocation in this repo: it is
            # already covered by `additional_cargo_args = ["--locked"]` in
            # src-tauri/.cargo/mutants.toml, which cargo-mutants applies to every cargo check/test
            # invocation it runs. Verified locally (cargo-mutants 27.1.0, the version pinned
            # above): passing `--cargo-arg=--locked` here as well fails the run with "the argument
            # '--locked' cannot be used multiple times", confirming it is already applied.
            #
            # `--shard k/n` splits the *mutant list*, not the file scope, which is why it is the
            # right knob here: `examine_globs`, `exclude_re` and `additional_cargo_args` all stay
            # exactly as mutants.toml declares them, and the shards partition the same set the
            # unsharded run would have produced. Verified against the pinned 27.1.0 on this tree:
            # the full list is 1047 mutants and shards 0/3, 1/3 and 2/3 list 349 each - an exact
            # partition, nothing dropped and nothing run twice. `k` is zero-based (`3/3` is refused
            # with "shard k must be less than n"), which is what `strategy.job-index` already is.
            #
            # `round-robin` rather than the default `slice`: consecutive mutants come from the same
            # file, so slicing would hand one shard a run of db_backup mutants and another a run of
            # cheap pure-function ones. Interleaving keeps the three legs about the same length.
            # `--no-shuffle` still applies, and now orders each shard's own slice deterministically.
            - name: Run Rust mutation testing
              run: >
                  cargo mutants --manifest-path src-tauri/Cargo.toml --in-place --no-shuffle
                  --timeout 300
                  --sharding round-robin
                  --shard ${{ strategy.job-index }}/${{ strategy.job-total }}

            # Same reasoning as the Stryker upload above, and it matters more here: a cargo-mutants
            # run rebuilds and tests the tree once per mutant, so reproducing one locally to find out
            # which mutant survived costs far more than reading `missed.txt` from the artifact.
            # mutants.out/ also carries outcomes.json, caught/unviable lists and the debug log.
            #
            # The name carries the shard index because upload-artifact refuses two artifacts with
            # the same name in one run - and it has to be the index rather than the `k/n` spec,
            # since an artifact name cannot contain a slash. Each shard reports only its own slice,
            # so triaging a red run means reading the artifact of the shard that failed.
            - name: Upload the cargo-mutants output
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: cargo-mutants-output-shard-${{ strategy.job-index }}
                  path: src-tauri/mutants.out
                  retention-days: 30

    # GitHub emails the maintainer when a scheduled run fails, but that is an easily-missed inbox
    # signal - mirrors scheduled-audit.yml's alert-on-failure job for the same reason. Open (or
    # comment on) a tracking issue so a failing mutation run is visible in the repository itself.
    # Runs only when a job above did not succeed, and only on the schedule/dispatch this workflow
    # already runs on.
    alert-on-failure:
        name: Open an issue on failure
        needs: [mutation, verify-exclusions, rust-mutation]
        # `failure()` alone was wrong, and it cost a real run: a job killed by its own
        # `timeout-minutes` is marked **cancelled**, not failed, so on 2026-07-27 the Rust leg died
        # at the 2h ceiling and this job was *skipped*. The gate stopped producing a verdict and the
        # one mechanism built to make that visible stayed quiet - the worse half of the bug, since a
        # gate that fails loudly is merely broken while a gate that goes silent reads as green.
        #
        # So the dependency results are checked explicitly instead of leaning on a status function.
        # `always()` is what lets this run at all once a dependency is cancelled; the consequence is
        # that cancelling the run by hand also opens an issue. That is the right direction to err:
        # a stray comment on an existing tracking issue costs a moment, whereas the alternative is
        # the failure mode this whole condition exists to close.
        if: >
            always() &&
            (needs.mutation.result == 'failure' || needs.mutation.result == 'cancelled' ||
             needs.verify-exclusions.result == 'failure' || needs.verify-exclusions.result == 'cancelled' ||
             needs.rust-mutation.result == 'failure' || needs.rust-mutation.result == 'cancelled')
        runs-on: ubuntu-26.04
        timeout-minutes: 10
        permissions:
            issues: write
        steps:
            - name: Open or update the tracking issue
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  # This job has no checkout step, and `gh issue` resolves the repository from the
                  # git remote of the working directory - so without this it dies with "fatal: not a
                  # git repository" before it can open anything. That was latent for as long as the
                  # job existed: `if: failure()` never matched a timeout, so it had never actually
                  # run. Setting GH_REPO is what a checkout would otherwise be needed for, minus the
                  # clone.
                  GH_REPO: ${{ github.repository }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                  # Read through `env:` rather than interpolated into the script body, matching
                  # release.yml's non-main guard: a `${{ }}` expansion is substituted into the shell
                  # source before it runs, so anything that could ever carry an unexpected character
                  # belongs in a variable the shell reads instead.
                  MUTATION_RESULT: ${{ needs.mutation.result }}
                  VERIFY_EXCLUSIONS_RESULT: ${{ needs.verify-exclusions.result }}
                  RUST_MUTATION_RESULT: ${{ needs.rust-mutation.result }}
                  STRYKER_VERDICT: ${{ needs.mutation.outputs.verdict }}
              run: |
                  # A run that produced a verdict and a run that never got to one are different
                  # problems with different owners, and collapsing them into one issue title was
                  # costing the more urgent of the two. "A mutant survived" is a request to write a
                  # test; "the gate stopped answering" is a request to fix the gate, and it is the
                  # one that quietly turns a green-looking schedule into no coverage at all. They get
                  # separate tracking issues so neither is read as the other, and so closing one does
                  # not silence the next occurrence of the other.
                  #
                  # A third owner joined that split when the exclusion check became a job of its own,
                  # and it is worth separating for the same reason the other two were: a stale
                  # `exclude_re` is neither a missing test nor a broken runner. It is a line in
                  # `src-tauri/.cargo/mutants.toml` naming a mutant that no longer exists, and the
                  # fix is to that file. Reported first, because it is also the finding that makes
                  # the rest of the run's verdict untrustworthy for the file the entry covers.
                  #
                  # No verdict means: a shard was killed by its own timeout-minutes (GitHub marks
                  # that *cancelled*, not failed), or Stryker aborted before reporting a score (a
                  # dry-run timeout is the observed case - see the classification step above).
                  NO_VERDICT=""

                  if [ "$MUTATION_RESULT" = "cancelled" ] || [ "$RUST_MUTATION_RESULT" = "cancelled" ]; then
                      NO_VERDICT="yes"
                  fi

                  # A cancelled exclusion check is the case that job was split out to make visible:
                  # it never answered, so nothing establishes that the exclusions still name real
                  # mutants - which is the same "the gate stopped answering" class as the two above.
                  if [ "$VERIFY_EXCLUSIONS_RESULT" = "cancelled" ]; then
                      NO_VERDICT="yes"
                  fi

                  if [ "$STRYKER_VERDICT" = "no-score" ]; then
                      NO_VERDICT="yes"
                  fi

                  if [ "$VERIFY_EXCLUSIONS_RESULT" = "failure" ]; then
                      TITLE="A mutants.toml exclusion no longer names a real mutant"
                      BODY="The weekly scheduled mutation run found an exclude_re entry in src-tauri/.cargo/mutants.toml that matches nothing. That is silent in both directions: either the mutant it suppressed is back and will redden this run for a reason unrelated to the tests, or the function it named was renamed and its real mutant is now unexcluded and unnoticed among the survivors. The run log lists the dead patterns; fix or delete them in mutants.toml: $RUN_URL"
                  elif [ -n "$NO_VERDICT" ]; then
                      TITLE="Scheduled mutation testing produced no verdict"
                      BODY="The weekly scheduled mutation testing run ended without a mutation score. Either a job was killed by its timeout-minutes (which GitHub reports as cancelled rather than failed) or Stryker aborted before reporting - a dry-run timeout is the case this has happened for. This is not a loss of test strength; the gate stopped answering, which reads as green until someone looks. Fix the run itself - add a shard, or raise dryRunTimeoutMinutes in stryker.config.json: $RUN_URL"
                  else
                      TITLE="Scheduled mutation testing failed"
                      BODY="The weekly scheduled mutation testing run reported a verdict and it was red - a mutant survived, or the score fell under thresholds.break. Read the uploaded report (Stryker HTML, or the failing shard's mutants.out/missed.txt) and shore up the affected tests: $RUN_URL"
                  fi

                  EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
                  if [ -n "$EXISTING" ]; then
                      gh issue comment "$EXISTING" --body "$BODY"
                  else
                      gh issue create --title "$TITLE" --body "$BODY"
                  fi

    # The other half of the job above, and without it that one degrades into noise. It only ever
    # opens or comments; nothing closed what it opened, so a tracking issue outlived the failure it
    # described and stayed open across every later green run. That is the same failure mode this
    # workflow keeps fixing elsewhere, with the sign flipped: "there is an open alert issue" stops
    # meaning "there is a failure now", and the next real one arrives as a comment on an issue that
    # already reads as known.
    #
    # It happened: #24 was opened on 2026-08-01 for a red run and was still open after the run the
    # next day went green.
    #
    # Closing rather than commenting, because an open issue is the signal. A comment saying "this is
    # fixed" on an issue that stays open is the state this exists to remove.
    close-on-success:
        name: Close the tracking issues on a green run
        needs: [mutation, verify-exclusions, rust-mutation]
        # Every job, not just the one whose title matches: a run is only evidence that a gate is
        # answering again if the whole gate ran. `success()` would be equivalent today, but naming
        # the dependencies keeps this in step with the condition above, which cannot use it.
        if: >
            needs.mutation.result == 'success' &&
            needs.verify-exclusions.result == 'success' &&
            needs.rust-mutation.result == 'success'
        runs-on: ubuntu-26.04
        timeout-minutes: 10
        permissions:
            issues: write
        steps:
            - name: Close any tracking issue this workflow opened
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  # No checkout step, so `gh issue` has no git remote to resolve the repository
                  # from - the same reason the job above sets this. See its comment.
                  GH_REPO: ${{ github.repository }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              run: |
                  # All three titles the alert job can open, closed by the same green run. A verdict
                  # of "no mutant survived" also answers "the gate is producing a verdict again" and
                  # "the exclusions still name real mutants", because producing it required both.
                  #
                  # The titles are matched exactly rather than by prefix: `gh issue list --search`
                  # is a full-text search, so a substring match could close an unrelated issue
                  # somebody opened by hand about the same subject.
                  while IFS= read -r title; do
                      number=$(gh issue list --state open --search "$title in:title" \
                          --json number,title \
                          --jq "[.[] | select(.title == \"$title\")] | .[0].number // empty")

                      if [ -n "$number" ]; then
                          echo "Closing #$number ($title)"
                          gh issue close "$number" \
                              --comment "A later run of this workflow completed green: $RUN_URL"
                      fi
                  done <<'TITLES'
                  Scheduled mutation testing failed
                  Scheduled mutation testing produced no verdict
                  A mutants.toml exclusion no longer names a real mutant
                  TITLES
