name: mutation

on:
    # Mutation testing is the higher-signal quality gate but too slow to run on every PR, so it
    # runs on a weekly schedule (Mondays 06:00 UTC) and on demand instead of gating each push.
    schedule:
        - cron: "0 6 * * 1"
    workflow_dispatch:

# The run only needs to read the repository.
permissions:
    contents: read

concurrency:
    group: mutation-${{ github.ref }}
    cancel-in-progress: true

jobs:
    mutation:
        name: Mutation testing
        # Pinned rather than `ubuntu-latest`, matching ci.yml's rust job: `-latest` can silently jump
        # an OS major, which would move a mutation score for a reason unrelated to the tests.
        runs-on: ubuntu-26.04
        # Generous timeout: a full mutation run is long, and this is a weekly scheduled run rather
        # than a per-PR gate, so a longer wall-clock is fine. A too-tight timeout would also report
        # as a failure indistinguishable from a real mutation-score regression.
        timeout-minutes: 120
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            # No version input: the pnpm version comes from package.json's packageManager
            # field, so CI and local Corepack install the same pinned pnpm.
            - name: Setup pnpm
              uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 26.5.0
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # Stryker exits non-zero when the mutation score falls below thresholds.break in
            # stryker.config.json, so a real regression in test strength fails this scheduled run.
            - name: Run mutation testing
              run: pnpm test:mutation

            # Without this the HTML report - the only artifact that says *which* mutants survived -
            # dies with the runner, so triaging a red run means reproducing a ~29-minute local run
            # first. `if: always()` because the failing run is precisely the one worth reading.
            - name: Upload the Stryker report
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: stryker-mutation-report
                  path: reports/mutation
                  retention-days: 30

    rust-mutation:
        name: Rust mutation testing (shard ${{ strategy.job-index }})
        # Pinned like the job above and ci.yml's rust job; see those comments.
        runs-on: ubuntu-26.04
        strategy:
            # One shard failing must not cancel the others: each covers a distinct slice of the
            # mutant list, so the surviving shards still produce a usable verdict for their slice.
            fail-fast: false
            matrix:
                # These values are never read. The shard is derived from `strategy.job-index` /
                # `strategy.job-total` in the run step below, so only the *length* of this list
                # matters: adding or removing an entry changes the shard count with nothing else to
                # keep in step. Spelling the count in two places is what this avoids, and the
                # failure it avoids is silent - a matrix of three against a hardcoded `/4` would
                # simply never run the fourth shard's mutants, and the run would go green.
                #
                # Four since 2026-07-31, and the reasoning is worth keeping because this is the knob
                # to reach for again. The scope was 1234 mutants across three shards on 2026-07-29,
                # whose legs took 68, 75 and 79 minutes against the ceiling below; adding
                # `live_chat_storage.rs` and `thumbnail/redirect.rs` took it to 1383, which puts the
                # slowest leg at roughly 88 - inside the ceiling by a margin that is not one. The
                # alternative was raising the ceiling, and that is the wrong direction: it exists to
                # be a number nothing approaches, and a leg killed by it reports as *cancelled*
                # rather than failed, which is exactly the outcome that went unreported on
                # 2026-07-27. A fourth shard puts each leg back around 346 mutants instead.
                shard: [1, 2, 3, 4]
        # Per shard, not for the whole run. The unsharded job hit exactly this ceiling on
        # 2026-07-27 (run 30256551949) after `examine_globs` grew from ten entries to twenty, and
        # was killed at 2h00m having produced no verdict - the two runs before it took ~56 minutes.
        # The scope is 1383 mutants today (`cargo mutants --list | wc -l`), so a quarter of it plus
        # one baseline build sits well inside this, and the ceiling stays low enough to be a real
        # signal rather than a number nothing ever approaches. When a leg starts creeping toward it,
        # add a shard rather than minutes - see the matrix above.
        timeout-minutes: 90
        # Trim debuginfo like ci.yml's Rust job: cargo-mutants rebuilds the tree once per mutant, so
        # keeping the per-build cost down matters more here than anywhere else.
        env:
            CARGO_PROFILE_DEV_DEBUG: "0"
            CARGO_PROFILE_TEST_DEBUG: "0"
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Install Rust toolchain
              # Pin the exact toolchain (keep in sync with rust-toolchain.toml), matching ci.yml.
              uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable (2026-06-30)
              with:
                  toolchain: 1.96.0

            # These apt packages are intentionally unpinned, like ci.yml/release.yml: exact pins on
            # a hosted image go stale as the archive drops old versions and break the build for a
            # reason unrelated to this project; they are dev headers, not shipped in any bundle.
            - name: Install Linux dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf lld
                  # Link with lld instead of the slow default ld.bfd, mirroring ci.yml's Rust job.
                  echo "RUSTFLAGS=-C link-arg=-fuse-ld=lld" >> "$GITHUB_ENV"

            # cache-on-failure is deliberately off here (unlike a normal build job): this job runs
            # cargo-mutants with `--in-place`, and a job-timeout kill (SIGKILL) can leave the working
            # tree mutated mid-run. Saving a cache derived from that mutated tree on a failed/cancelled
            # run is the one interaction worth avoiding; a fresh checkout would re-fingerprint and
            # rebuild the changed files next run, but not persisting a failure-run cache removes the
            # question entirely. A successful run still caches normally.
            #
            # No per-shard cache key: every shard builds the same unmutated tree, so they share one
            # entry rather than storing three near-identical copies against the repository's cache
            # quota. They race to save it and all but one log a benign "already exists".
            - name: Cache Rust build
              uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
              with:
                  workspaces: src-tauri
                  cache-on-failure: "false"

            # Pin the tool version, like ci.yml/release.yml do for cargo-audit and cargo-deny: an
            # unpinned `cargo install` builds whatever the latest release happens to be on the day
            # the schedule fires, so a mutation score could move because the tool changed rather
            # than because the tests did.
            - name: Install cargo-mutants
              run: cargo install cargo-mutants@27.1.0 --locked

            # Mutates only the security-critical modules (see src-tauri/.cargo/mutants.toml's
            # examine_globs): path containment, the library-path guard, the yt-dlp host allow-list,
            # and external-binary resolution. cargo-mutants exits 2 when a mutant survives - a logic
            # change its tests did not catch - which fails this scheduled run, the mutation-level
            # counterpart to Stryker for the frontend. The generous per-mutant timeout keeps a
            # mutation-induced infinite loop from being misreported instead of caught.
            #
            # `--in-place` is required, not a preference: cargo-mutants' default copies only the
            # `src-tauri` package into a scratch dir, but the youtube-handle parity test
            # (utils/validation.rs) `include_str!`s `../shared/youtube-handle-cases.json` from the
            # repo root - a fixture deliberately shared with the TypeScript side. The copy leaves
            # that sibling behind, so the unmutated baseline build fails there ("cargo build failed
            # in an unmutated tree") before a single mutant runs. Testing in the real tree keeps the
            # `../shared` path resolvable. The CI checkout is disposable, so the in-place caveats
            # (no parallel copies; a killed run leaves the tree mutated) do not apply here.
            #
            # No explicit `--locked` here, unlike every other cargo invocation in this repo: it is
            # already covered by `additional_cargo_args = ["--locked"]` in
            # src-tauri/.cargo/mutants.toml, which cargo-mutants applies to every cargo check/test
            # invocation it runs. Verified locally (cargo-mutants 27.1.0, the version pinned
            # above): passing `--cargo-arg=--locked` here as well fails the run with "the argument
            # '--locked' cannot be used multiple times", confirming it is already applied.
            #
            # `--shard k/n` splits the *mutant list*, not the file scope, which is why it is the
            # right knob here: `examine_globs`, `exclude_re` and `additional_cargo_args` all stay
            # exactly as mutants.toml declares them, and the shards partition the same set the
            # unsharded run would have produced. Verified against the pinned 27.1.0 on this tree:
            # the full list is 1047 mutants and shards 0/3, 1/3 and 2/3 list 349 each - an exact
            # partition, nothing dropped and nothing run twice. `k` is zero-based (`3/3` is refused
            # with "shard k must be less than n"), which is what `strategy.job-index` already is.
            #
            # `round-robin` rather than the default `slice`: consecutive mutants come from the same
            # file, so slicing would hand one shard a run of db_backup mutants and another a run of
            # cheap pure-function ones. Interleaving keeps the three legs about the same length.
            # `--no-shuffle` still applies, and now orders each shard's own slice deterministically.
            - name: Run Rust mutation testing
              run: >
                  cargo mutants --manifest-path src-tauri/Cargo.toml --in-place --no-shuffle
                  --timeout 300
                  --sharding round-robin
                  --shard ${{ strategy.job-index }}/${{ strategy.job-total }}

            # Same reasoning as the Stryker upload above, and it matters more here: a cargo-mutants
            # run rebuilds and tests the tree once per mutant, so reproducing one locally to find out
            # which mutant survived costs far more than reading `missed.txt` from the artifact.
            # mutants.out/ also carries outcomes.json, caught/unviable lists and the debug log.
            #
            # The name carries the shard index because upload-artifact refuses two artifacts with
            # the same name in one run - and it has to be the index rather than the `k/n` spec,
            # since an artifact name cannot contain a slash. Each shard reports only its own slice,
            # so triaging a red run means reading the artifact of the shard that failed.
            - name: Upload the cargo-mutants output
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: cargo-mutants-output-shard-${{ strategy.job-index }}
                  path: src-tauri/mutants.out
                  retention-days: 30

    # GitHub emails the maintainer when a scheduled run fails, but that is an easily-missed inbox
    # signal - mirrors scheduled-audit.yml's alert-on-failure job for the same reason. Open (or
    # comment on) a tracking issue so a failing mutation run is visible in the repository itself.
    # Runs only when a job above did not succeed, and only on the schedule/dispatch this workflow
    # already runs on.
    alert-on-failure:
        name: Open an issue on failure
        needs: [mutation, rust-mutation]
        # `failure()` alone was wrong, and it cost a real run: a job killed by its own
        # `timeout-minutes` is marked **cancelled**, not failed, so on 2026-07-27 the Rust leg died
        # at the 2h ceiling and this job was *skipped*. The gate stopped producing a verdict and the
        # one mechanism built to make that visible stayed quiet - the worse half of the bug, since a
        # gate that fails loudly is merely broken while a gate that goes silent reads as green.
        #
        # So the dependency results are checked explicitly instead of leaning on a status function.
        # `always()` is what lets this run at all once a dependency is cancelled; the consequence is
        # that cancelling the run by hand also opens an issue. That is the right direction to err:
        # a stray comment on an existing tracking issue costs a moment, whereas the alternative is
        # the failure mode this whole condition exists to close.
        if: >
            always() &&
            (needs.mutation.result == 'failure' || needs.mutation.result == 'cancelled' ||
             needs.rust-mutation.result == 'failure' || needs.rust-mutation.result == 'cancelled')
        runs-on: ubuntu-26.04
        timeout-minutes: 10
        permissions:
            issues: write
        steps:
            - name: Open or update the tracking issue
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  # This job has no checkout step, and `gh issue` resolves the repository from the
                  # git remote of the working directory - so without this it dies with "fatal: not a
                  # git repository" before it can open anything. That was latent for as long as the
                  # job existed: `if: failure()` never matched a timeout, so it had never actually
                  # run. Setting GH_REPO is what a checkout would otherwise be needed for, minus the
                  # clone.
                  GH_REPO: ${{ github.repository }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              run: |
                  TITLE="Scheduled mutation testing failed"
                  BODY="The weekly scheduled mutation testing run did not succeed - a mutant survived, a test regressed, a shard ran past its timeout (which reports as cancelled, not failed), or the run itself errored. Review the run and shore up the affected tests: $RUN_URL"
                  EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
                  if [ -n "$EXISTING" ]; then
                      gh issue comment "$EXISTING" --body "$BODY"
                  else
                      gh issue create --title "$TITLE" --body "$BODY"
                  fi
