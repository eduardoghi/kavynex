name: release

on:
    workflow_dispatch:

# Least-privilege default for the whole workflow, matching ci.yml/mutation.yml. The jobs that need
# more escalate in their own `permissions:` block (publish-tauri: contents/id-token/attestations
# write; checksums: contents write); the audit job stays read-only. Declaring the read-only default
# here means a job added later without its own block inherits read-only rather than the
# repository/organization default, so a new job cannot silently gain write access.
permissions:
    contents: read

# Only one release may be in flight at a time. Without this, two manual dispatches (the classic
# "I don't think the first one started") both pass the "tag does not exist yet" check below,
# both build and sign on four runners, and both upload assets to the same draft - leaving the
# checksums job to hash whatever mix of the two happened to land. That is a corrupted release,
# not just wasted minutes.
#
# `cancel-in-progress: false` is the point: cancelling a run that is already signing or
# uploading is worse than making the second one wait. The queued run starts only after the
# first finishes, by which time the tag exists and its own guard fails it with a clear message.
#
# Unlike ci.yml/mutation.yml this group is deliberately not keyed on `github.ref`: what is
# contended here is not the ref but the release itself (one tag, one draft, one set of assets),
# which is repository-global. Two dispatches from different refs carrying the same package.json
# version would still collide on the same tag, and a per-ref group would happily let them.
concurrency:
    group: release
    cancel-in-progress: false

jobs:
    # The dependency gates run in their own job, deliberately kept out of publish-tauri: they
    # `cargo install` third-party tools, which compiles and runs those crates' build scripts on
    # the runner, and publish-tauri is the runner that holds TAURI_SIGNING_PRIVATE_KEY. Building
    # them here instead keeps that code off the signing job entirely, and compiles each tool once
    # rather than once per matrix platform. publish-tauri `needs` this, so a failed gate still
    # blocks the release (the release is dispatched manually, so nothing guarantees the chosen
    # ref already passed ci.yml's identical checks).
    audit:
        name: Cargo audit and deny
        # Pinned like the build matrix below; `-latest` can silently jump an OS major mid-release.
        runs-on: ubuntu-26.04
        timeout-minutes: 60
        # No secrets are needed to read the lockfile; this job never gets the signing key.
        permissions:
            contents: read
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Install Rust toolchain
              # Pin the exact toolchain (keep in sync with rust-toolchain.toml) instead of a
              # moving "stable".
              uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable (2026-06-30)
              with:
                  toolchain: 1.96.0

            # Pin the tool version (keep in sync with ci.yml): an unpinned `cargo install` builds
            # whatever the latest release happens to be at dispatch time, so the code executing on
            # the runner is not the code this repository last reviewed. Pinning costs nothing in
            # security freshness - cargo-audit downloads the RustSec advisory database at run
            # time, so a pinned tool still checks against today's advisories.
            - name: Install cargo-audit
              run: cargo install cargo-audit@0.22.2 --locked

            # RUSTSEC advisories are not covered by the JS advisory check; this closes that gap
            # for the Rust dependency tree. Same flags as ci.yml's audit job, which is where the
            # reasoning for each one is written down - they have to stay in step, since the release
            # is dispatched by hand and cannot assume CI ever ran against the chosen commit.
            - name: Audit Rust dependencies
              run: >
                  cargo audit --file src-tauri/Cargo.lock
                  --deny unsound
                  --ignore RUSTSEC-2024-0429

            - name: Install cargo-deny
              run: cargo install cargo-deny@0.20.2 --locked

            # cargo-audit covers advisories; cargo-deny adds the checks it does not: license
            # compliance, dependency source trust (crates.io only), and wildcard requirements.
            # Config: src-tauri/deny.toml.
            - name: Check licenses, sources and bans
              run: cargo deny --manifest-path src-tauri/Cargo.toml check licenses bans sources

    # The production JS advisory, license and lint gates run in their own job that publish-tauri
    # `needs`, so every build leg is blocked until they pass - symmetric with the `audit` (Rust)
    # job above. Previously these ran inside publish-tauri gated to the Ubuntu leg, which failed
    # only that leg: with fail-fast off, the Windows and macOS legs would still build, sign and
    # upload their installers to the draft before the Ubuntu failure was even visible. These checks
    # are platform-independent (they read the lockfile / run ESLint), so one Ubuntu run gates all
    # four build legs. The frontend test suite stays in publish-tauri instead of moving here,
    # because it is not fully platform-independent (ICU date formatting) and is worth running on
    # each target.
    frontend-audit:
        name: Frontend audit
        runs-on: ubuntu-26.04
        timeout-minutes: 30
        permissions:
            contents: read
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup pnpm
              uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 26.5.0
                  cache: pnpm

            # Re-gate the Node version pin here too: the release is dispatched by hand, so nothing
            # guarantees the chosen ref went through ci.yml's identical check.
            - name: Verify Node version consistency
              run: node scripts/verify-node-version.js

            - name: Install frontend dependencies
              run: pnpm install --frozen-lockfile

            - name: Audit production JS dependencies
              run: pnpm run advisories:check

            - name: Check production JS licenses
              run: pnpm licenses:check

            - name: Lint
              run: pnpm lint

    publish-tauri:
        needs: [audit, frontend-audit]
        permissions:
            contents: write
            # Build provenance attestation (actions/attest-build-provenance): id-token mints
            # the short-lived Sigstore OIDC identity for the keyless signature, attestations
            # uploads the resulting statement to the repository.
            id-token: write
            attestations: write

        strategy:
            fail-fast: false
            matrix:
                # Pinned images, like ubuntu-26.04 already was, rather than the `-latest` aliases.
                # `-latest` moves to a new major OS whenever GitHub decides, which is not a
                # theoretical worry here: the 2026-07-14 run resolved `macos-latest` to
                # macos-26-arm64 while the runner-images README still documented it as macOS 15.
                # The Rust toolchain and Node are pinned to the version, so leaving the OS itself
                # free is the one thing that could still change what a release is built on between
                # two otherwise identical runs. These are the images those runs actually used, so
                # this pins current behavior rather than changing it; bump them deliberately.
                include:
                    - platform: macos-26
                      args: --target aarch64-apple-darwin

                    - platform: macos-26
                      args: --target x86_64-apple-darwin

                    - platform: ubuntu-26.04
                      args: ""

                    - platform: windows-2025
                      args: ""

                    # aarch64 legs build natively on the arm64-hosted runners: the host default
                    # target is already aarch64, so they need no `--target` and no extra rustup
                    # target, exactly like the x64 ubuntu/windows legs above. ubuntu-26.04-arm keeps
                    # the same OS major as the x64 Linux leg (pin symmetry) at the cost of being a
                    # public-preview image, so it can queue more than the GA ubuntu-24.04-arm.
                    # windows-11-arm is the GA Windows-on-ARM image.
                    #
                    # Both shipped in v1.2.0 and are proven end to end. Worth recording what the one
                    # failure actually was, since "preview image" is the tempting explanation and was
                    # the wrong one: the aarch64 leg died bundling the AppImage because the arm64
                    # runner image does not carry xdg-utils, which that bundler requires and the x64
                    # image happens to provide. Switching to ubuntu-24.04-arm would not have helped;
                    # installing the package did. Move to the GA image only if queueing becomes a
                    # real problem, not on a suspicion that preview means unstable.
                    - platform: ubuntu-26.04-arm
                      args: ""

                    - platform: windows-11-arm
                      args: ""

        runs-on: ${{ matrix.platform }}
        # This job holds the repository-wide `release` concurrency lock (cancel-in-progress is
        # deliberately false), so a hang here blocks every later release dispatch until GitHub's
        # 6h default expires. Bound it well above the slowest matrix leg instead.
        timeout-minutes: 90

        steps:
            # This is the job that holds TAURI_SIGNING_PRIVATE_KEY and `contents: write`, so it is
            # where a stray dispatch must be stopped. `workflow_dispatch` lets the runner pick any
            # ref, and nothing else pins it to main - so without this a build from a throwaway or
            # unreviewed branch would be compiled, signed with the real minisign key, and published
            # as a draft. Fail before checkout, before any secret is in scope. `github.ref` is
            # `refs/heads/<branch>` for a branch dispatch.
            # `github.ref` goes through `env:` rather than being interpolated into the script:
            # `${{ }}` is substituted before the shell ever parses the line, and a branch name may
            # contain shell metacharacters, so interpolating it directly would let a branch named
            # `$(...)` run its own code in a job that holds `id-token: write`. It takes push access
            # to reach, which is not much of an attacker, but this is the one step where a hostile
            # ref is the expected input.
            - name: Refuse to release from a non-main ref
              if: github.ref != 'refs/heads/main'
              env:
                  DISPATCHED_REF: ${{ github.ref }}
              run: |
                  echo "::error::Release must be dispatched from main, got $DISPATCHED_REF." >&2
                  exit 1

            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  # A shallow checkout is enough, and stated explicitly rather than left to the
                  # default because this step carried a full clone (`fetch-depth: 0`) until the
                  # reason for it was traced and found to be gone. That reason was the release
                  # notes, which used to list every commit since the previous tag with `git log`;
                  # that step was removed once it turned out tauri-action copies the whole body
                  # into latest.json's `notes`, where the app renders it unscrolled.
                  #
                  # Nothing left in this job walks history: the tag guard uses `git ls-remote`
                  # (which queries the remote, not the local clone), the bindings check diffs the
                  # working tree against HEAD, and tauri-action creates the tag through the GitHub
                  # REST API - `repos.createRelease` with `target_commitish` defaulting to
                  # `context.sha`, i.e. the GITHUB_SHA string - never a local `git tag`. Verified
                  # by reading tauri-action's source at the SHA this workflow pins for it further
                  # down; re-check that when the pin moves. The sbom and checksums jobs have always
                  # checked out shallow, which is the same claim already proven by a real release.
                  fetch-depth: 1

            # No version input: the pnpm version comes from package.json's packageManager
            # field, so CI and local Corepack install the same pinned pnpm.
            - name: Setup pnpm
              uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  # Pinned to the Node major @types/node targets (26), so release builds run
                  # on the same runtime the code is type-checked against. Bump both together.
                  node-version: 26.5.0
                  cache: pnpm

            - name: Install Rust toolchain
              # Pin the exact toolchain (keep in sync with rust-toolchain.toml) instead of pulling
              # whatever "stable" is at build time, so released binaries are built with a
              # deterministic compiler that does not drift with upstream releases.
              uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable (2026-06-30)
              with:
                  toolchain: 1.96.0
                  components: rustfmt, clippy
                  targets: ${{ matrix.platform == 'macos-26' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

            # No Rust build cache here, deliberately - and unlike ci.yml, whose Rust jobs use
            # Swatinem/rust-cache. These are the bytes that get minisign-signed and provenance-
            # attested below, so the release compiles the whole dependency tree from source on every
            # run rather than restoring a cache: a poisoned or stale cache entry could otherwise
            # influence a signed artifact without leaving a trace. The 90-minute job timeout already
            # accommodates the cold compile - build time is not the constraint that matters on the
            # job that holds the signing key.

            # These apt packages are deliberately not version-pinned, unlike the Rust toolchain,
            # Node and the runner image. Exact apt pins on a GitHub-hosted image are brittle: the
            # archive supersedes old versions and drops them, so a pinned `pkg=version` starts
            # failing the moment the image refreshes, turning a green build red for a reason
            # unrelated to this project. The cost of leaving them free is bounded: these are the
            # Linux WebKit/GTK dev headers used to build against, dynamically linked at runtime
            # against the end user's own system libraries, so they are not shipped inside the
            # bundle and cannot change what a user actually runs.
            # startsWith so this also runs on ubuntu-26.04-arm: the aarch64 leg needs the same
            # WebKit/GTK dev headers, installed natively (the runner is arm64, so apt fetches the
            # arm64 packages - no multiarch/cross setup).
            #
            # xdg-utils supplies /usr/bin/xdg-open, which the AppImage bundler copies into the
            # bundle and refuses to proceed without. The x64 image happens to ship it, the arm64
            # one does not, so the first aarch64 dispatch built the deb and the rpm and then died
            # on the AppImage - taking all three down, since the leg uploads nothing when the
            # bundle step fails. Installed explicitly on both rather than relying on either image
            # to keep providing it, which is what made this a surprise in the first place.
            - name: Install Linux dependencies
              if: startsWith(matrix.platform, 'ubuntu-')
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils

            - name: Verify version consistency
              run: node scripts/verify-release-version.js

            # Refuse to re-release a version that is already out. The tag is created by
            # tauri-action further down, i.e. *before* the sbom and checksums jobs run, so a
            # dispatch that got as far as building and then failed one of those later gates leaves
            # the tag behind on a release that is still a draft. Treating "the tag exists" as
            # "already released" would make every such failure cost a version number: the fix for a
            # wrong asset-name pattern in the checksums job would be a version bump, not a retry.
            # So the guard asks what the tag actually means. A tag on a *published* release is
            # final - bump the version. A tag whose release is still a draft is the residue of an
            # incomplete dispatch, and re-running over it is the intended recovery: tauri-action
            # reuses the existing draft and re-uploads its assets. A tag with no release at all
            # (the release was deleted by hand, or the tag was pushed some other way) is refused
            # too, since nothing proves what it points at.
            - name: Verify the release tag is free or belongs to an unfinished draft
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  VERSION=$(node -p "require('./package.json').version")

                  if ! git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null 2>&1; then
                      echo "Tag v$VERSION is free."
                      exit 0
                  fi

                  # `|| true` so a missing release (gh exits non-zero) falls through to the refusal
                  # below with an empty value, rather than failing the step on its own.
                  IS_DRAFT=$(gh release view "v$VERSION" --json isDraft --jq '.isDraft' 2>/dev/null || true)

                  if [ "$IS_DRAFT" = "true" ]; then
                      echo "::warning::Tag v$VERSION already exists, but its release is still a draft - retrying that dispatch."
                      exit 0
                  fi

                  if [ "$IS_DRAFT" = "false" ]; then
                      echo "::error::Release v$VERSION is already published; bump the version before releasing." >&2
                  else
                      echo "::error::Tag v$VERSION exists with no release behind it; delete the tag or bump the version." >&2
                  fi

                  exit 1

            - name: Build release notes
              id: release_notes
              shell: bash
              run: |
                  # This body is not only the release description: tauri-action also writes it into
                  # latest.json's `notes`, which the in-app update notice renders as a single
                  # unscrolled block (app-update-section.tsx). So it stays one short line, and the
                  # commit log is deliberately not inlined - it would be unreadable there, and this
                  # release alone carries hundreds of commits. The changelog belongs on the release
                  # page, written by hand on the draft before publishing; editing the draft does not
                  # regenerate latest.json, so that text reaches GitHub without reaching the app.
                  #
                  # The repository comes from GITHUB_REPOSITORY rather than being spelled out, for
                  # the same reason verify-latest-json.js derives its URL prefix from the updater
                  # endpoint: moving the repo must not leave a second hardcoded copy pointing at the
                  # old one.
                  VERSION=$(node -p "require('./package.json').version")
                  # The body is fully controlled here (a fixed sentence plus the version from
                  # package.json), but the delimiter stays randomized so that adding any dynamic
                  # content later cannot terminate the block early and inject extra key=value pairs
                  # into GITHUB_OUTPUT. openssl is present on all GitHub-hosted runners.
                  DELIM="NOTES_EOF_$(openssl rand -hex 16)"
                  {
                      echo "body<<$DELIM"
                      echo "See the release page for what changed in this version: https://github.com/${GITHUB_REPOSITORY}/releases/tag/v$VERSION"
                      echo "$DELIM"
                  } >> "$GITHUB_OUTPUT"

            - name: Install frontend dependencies
              run: pnpm install --frozen-lockfile

            # The JS advisory, license and lint gates run in the separate `frontend-audit` job that
            # this job `needs`, so they block every build leg before any binary is signed - see that
            # job for why they were moved out of here. The frontend tests stay below because, unlike
            # those three, they are not fully platform-independent.

            # `test:coverage` rather than a plain run, mirroring ci.yml: the coverage floors live
            # in vitest.config.ts and are only enforced when coverage is collected, so running
            # without it silently drops that gate from the release path - the one path that cannot
            # assume ci.yml ever ran against this ref. Kept on every matrix target rather than
            # Ubuntu-only like Lint: the suite is jsdom-based but not fully platform-independent
            # (date formatting varies with the runner's ICU - see the U+202F handling in
            # media-utils.test.ts), so each platform is worth exercising.
            - name: Run tests
              run: pnpm test:coverage

            # The release is dispatched manually, so nothing guarantees the chosen ref went
            # through ci.yml. Gate the published binaries on the same Rust checks CI runs.
            - name: Check Rust formatting
              run: cargo fmt --manifest-path src-tauri/Cargo.toml --all --check

            - name: Clippy
              run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings

            # Covers the yt-dlp process-kill/timeout/cancel tests too: they used to be `#[ignore]`d
            # (they hung on the ubuntu-22.04 runner) and needed a dedicated step here, but the hang
            # is gone on ubuntu-26.04 and the attribute was dropped, so they run in the step below
            # on every platform.
            #
            # There is still no `--ignored` step, and the reason is now that the two tests it would
            # match must not run here rather than that it would match nothing. One regenerates a
            # migration fixture (a manual generator, whose whole effect is rewriting a checked-in
            # file), and the other fetches live yt-dlp metadata to check the captured fixture has
            # not drifted, which needs the network and a real yt-dlp. Neither belongs on the path
            # that builds a published binary. Run the second deliberately when yt-dlp is bumped;
            # see its doc comment in services/yt_dlp/metadata.rs.
            - name: Run Rust tests
              run: cargo test --manifest-path src-tauri/Cargo.toml --locked

            # Mirror ci.yml's bindings-freshness gate so a release cannot ship with the
            # checked-in TypeScript bindings out of sync with the Rust types they are generated
            # from. Ubuntu only, matching ci.yml; the check is platform-independent.
            - name: Verify generated TS bindings are up to date
              if: matrix.platform == 'ubuntu-26.04'
              run: |
                  cargo test --manifest-path src-tauri/Cargo.toml --locked --lib export_bindings
                  git diff --exit-code -- src/types/generated

            - name: Build frontend
              run: pnpm build

            # The `audit` and `sbom` jobs both describe `src-tauri/Cargo.lock`: one gates it against
            # RUSTSEC and the license/source allow-lists, the other publishes it as the release's
            # SBOM, i.e. the machine-readable answer to "does this release ship crate X at version
            # Y?". Neither statement is worth anything unless the signed binary is compiled from
            # that exact lockfile.
            #
            # Every other cargo invocation in this job already passes `--locked`; the build did not,
            # and `Cargo.toml` uses caret requirements (`tauri = "2"`), so a lockfile that had drifted
            # out of sync with the manifest would be silently re-resolved here - producing a binary
            # containing crates the SBOM does not list and `cargo audit` never examined. Nothing else
            # in the pipeline would notice.
            #
            # Two defenses, because they fail at different points. This one fails the run *before*
            # the build if the lockfile is not already consistent with the manifest (`cargo metadata`
            # resolves the graph without compiling, so it is seconds); the `-- --locked` below makes
            # cargo itself refuse to re-resolve even if this step is ever dropped.
            # `shell: bash` because of the redirect, and it is not optional here. This job is a
            # matrix, and GitHub's default shell on the Windows legs is PowerShell, where
            # `/dev/null` is not a null device but a path - so both Windows legs failed with
            # "Could not find a part of the path 'D:\dev\null'" the first time this step ran on
            # them. It could not have failed earlier: the step landed after v1.2.0, so the release
            # that proved the Windows legs predates it.
            #
            # The redirect itself stays. Only the exit code matters here, and `--format-version 1`
            # prints the whole resolved dependency graph as JSON - hundreds of kilobytes of log for
            # a check whose entire output is pass or fail.
            #
            # actionlint does not catch this class of mistake, which is worth knowing rather than
            # trusting: it runs shellcheck over `run:` blocks as *bash*, so a POSIX-ism in a step
            # that will actually execute under PowerShell reads as correct to it.
            - name: Verify the lockfile matches the manifest
              shell: bash
              run: cargo metadata --manifest-path src-tauri/Cargo.toml --locked --format-version 1 > /dev/null

            - name: Build and publish Tauri app
              uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
              with:
                  tagName: v__VERSION__
                  releaseName: Kavynex v__VERSION__
                  releaseBody: ${{ steps.release_notes.outputs.body }}
                  releaseDraft: true
                  prerelease: false
                  # Everything after `--` is forwarded verbatim to the runner (cargo) by the Tauri
                  # CLI - see `tauri build --help`, whose ARGS are documented as "Command line
                  # arguments passed to the runner. Use `--` to explicitly mark the start of the
                  # arguments". So this is the build's own `--locked`, matching the clippy/test/
                  # bindings steps above. See the lockfile step for why it matters here.
                  args: ${{ matrix.args }} -- --locked

            # Start the binary that was just built, and require it to complete startup.
            #
            # This is the only step in the entire pipeline that runs the application. Everything
            # above proves the code compiles and its tests pass: `cargo test` links the `rlib` and
            # never initializes the Tauri runtime, the webview or `setup()`, and `pnpm build` only
            # emits the frontend bundle. So every failure that lives between "compiles" and "opens"
            # - an application manifest the loader rejects, a runtime library the bundle does not
            # resolve, a plugin that fails to register, a panic in `setup()` - crossed six green
            # matrix legs and reached the user as an app that does not open, with a provenance
            # attestation vouching for it. This project has already shipped one such bug.
            #
            # `--smoke-test` (src-tauri/src/lib.rs) runs the whole of `setup()` and exits 0 without
            # entering the event loop. It is placed after the build so the real artifact is what
            # gets exercised, and before the attestation below so a broken binary is never attested.
            # A failure here leaves assets on the draft and turns the run red, which is the intended
            # outcome: the draft is published by hand, and the maintainer must not publish a red run.
            #
            # xvfb on Linux because the webview needs a display to initialize at all - the check
            # would otherwise fail for the wrong reason. Windows and macOS runners have a session.
            - name: Smoke-test the built binary (Linux)
              if: startsWith(matrix.platform, 'ubuntu-')
              run: |
                  sudo apt-get install -y xvfb
                  binary=$(find src-tauri/target -type f -path '*/release/kavynex' | head -n1)

                  if [ -z "$binary" ]; then
                      echo "::error::no built kavynex binary was found to smoke-test" >&2
                      exit 1
                  fi

                  echo "Smoke-testing $binary"
                  xvfb-run -a "$binary" --smoke-test

            - name: Smoke-test the built binary (Windows)
              if: startsWith(matrix.platform, 'windows-')
              shell: bash
              run: |
                  binary=$(find src-tauri/target -type f -path '*/release/kavynex.exe' | head -n1)

                  if [ -z "$binary" ]; then
                      echo "::error::no built kavynex.exe was found to smoke-test" >&2
                      exit 1
                  fi

                  echo "Smoke-testing $binary"
                  "$binary" --smoke-test

            # The x86_64 macOS leg is a cross-compile: `macos-26` is an arm64 runner, so its output
            # cannot be executed here without Rosetta, which the image is not guaranteed to carry.
            # Skipping it is honest rather than convenient - that one binary is built and signed
            # without ever being run, and nothing in this workflow can change that. The aarch64 leg
            # is native and covers the same code on the same OS.
            - name: Smoke-test the built binary (macOS)
              if: startsWith(matrix.platform, 'macos-') && !contains(matrix.args, 'x86_64')
              run: |
                  binary=$(find src-tauri/target -type f -path '*/release/kavynex' | head -n1)

                  if [ -z "$binary" ]; then
                      echo "::error::no built kavynex binary was found to smoke-test" >&2
                      exit 1
                  fi

                  echo "Smoke-testing $binary"
                  "$binary" --smoke-test

            # The deeper half of the same idea, and the only thing in this pipeline that opens the
            # window.
            #
            # `--smoke-test` above exits inside `setup()`, before the event loop - so everything the
            # user actually meets is still unverified at that point: the frontend bundle loading,
            # the CSP Tauri injects only into a *packaged* app (`pnpm tauri dev` serves the page
            # from the Vite origin with no CSP header at all), and every permission in
            # `src-tauri/capabilities/`, which the ACL evaluates at runtime and nowhere else. That
            # last one is why this step exists: the grant list was narrowed from the scaffolded
            # `core:default` to the exact set the seam uses, which is right, and is also exactly the
            # change whose failure mode is a call the renderer makes being silently refused.
            #
            # `--webview-check` (src-tauri/src/commands/webview_check.rs) lets the launch proceed
            # normally, has the renderer drive one call of each family - getVersion, listen/unlisten,
            # and an image served through convertFileSrc out of the granted cache directory - and
            # exits 0 or 1. A renderer that never loads reports nothing, which a watchdog turns into
            # a non-zero exit with a message rather than a hang.
            #
            # What it deliberately does not cover, since neither can run without a side effect: the
            # dialog/opener/updater/process plugin grants. Those stay a manual pass.
            #
            # It cannot live in ci.yml: that workflow never builds a bundle, and the CSP and the
            # embedded frontend only exist in one. Placed beside the smoke test for the same reason
            # that one is here - after the build so the real artifact is what runs, and before the
            # attestation so a broken binary is never attested.
            - name: Webview check on the built binary (Linux)
              if: startsWith(matrix.platform, 'ubuntu-')
              # WebKit picks a rendering path that needs a GPU/DMA-BUF it does not have under Xvfb,
              # and fails to paint rather than falling back. Without these the check would report a
              # webview that never loaded, for a reason that has nothing to do with this app.
              env:
                  WEBKIT_DISABLE_COMPOSITING_MODE: "1"
                  WEBKIT_DISABLE_DMABUF_RENDERER: "1"
              run: |
                  binary=$(find src-tauri/target -type f -path '*/release/kavynex' | head -n1)

                  if [ -z "$binary" ]; then
                      echo "::error::no built kavynex binary was found to webview-check" >&2
                      exit 1
                  fi

                  echo "Webview-checking $binary"
                  xvfb-run -a "$binary" --webview-check

            - name: Webview check on the built binary (Windows)
              if: startsWith(matrix.platform, 'windows-')
              shell: bash
              run: |
                  binary=$(find src-tauri/target -type f -path '*/release/kavynex.exe' | head -n1)

                  if [ -z "$binary" ]; then
                      echo "::error::no built kavynex.exe was found to webview-check" >&2
                      exit 1
                  fi

                  echo "Webview-checking $binary"
                  "$binary" --webview-check

            # Skipped on the x86_64 macOS leg for the same reason as the smoke test above: that leg
            # is a cross-compile on an arm64 runner and its output cannot be executed here.
            - name: Webview check on the built binary (macOS)
              if: startsWith(matrix.platform, 'macos-') && !contains(matrix.args, 'x86_64')
              run: |
                  binary=$(find src-tauri/target -type f -path '*/release/kavynex' | head -n1)

                  if [ -z "$binary" ]; then
                      echo "::error::no built kavynex binary was found to webview-check" >&2
                      exit 1
                  fi

                  echo "Webview-checking $binary"
                  "$binary" --webview-check

            # Records a signed, keyless (Sigstore) statement that these exact installer bytes
            # were built by this workflow, from this commit. Independent of the minisign updater
            # signature: users can run `gh attestation verify <file> --repo eduardoghi/kavynex`
            # to confirm a downloaded installer's provenance. The `**` before `release` matches
            # both the plain (windows/linux) and target-triple (macOS) bundle layouts; only the
            # extensions produced on each runner match, which is enough for at least one subject.
            # The `.app.tar.gz` is the macOS updater bundle - the artifact a mac user actually
            # receives via in-app auto-update (the .dmg is only for a manual install), so it must be
            # attested too, not just the disk image.
            - name: Attest build provenance
              uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
              with:
                  subject-path: |
                      src-tauri/target/**/release/bundle/**/*.exe
                      src-tauri/target/**/release/bundle/**/*.msi
                      src-tauri/target/**/release/bundle/**/*.dmg
                      src-tauri/target/**/release/bundle/**/*.AppImage
                      src-tauri/target/**/release/bundle/**/*.deb
                      src-tauri/target/**/release/bundle/**/*.rpm
                      src-tauri/target/**/release/bundle/**/*.app.tar.gz

    # A CycloneDX SBOM (Software Bill of Materials) of the Rust dependency tree that goes into the
    # shipped binary, published as a release asset. It is generated from the committed Cargo.lock, so
    # it lists the exact crate versions a downloader received - the machine-readable answer to "does
    # this release contain crate X at version Y?" when an advisory lands later. Kept in its own job,
    # out of publish-tauri, for the same reason as the audit job: `cargo install` compiles a
    # third-party tool (and its build scripts) on the runner, which must never run on the leg that
    # holds the signing key. The JS build-time tree is deliberately not included here - it is bundled
    # into the frontend assets rather than being a native dependency of the binary, and is already
    # advisory/license-gated by the frontend-audit job and pinned in pnpm-lock.yaml.
    sbom:
        name: Publish SBOM
        needs: publish-tauri
        # Run even if a build leg failed (but not on a manual cancel), so this and the completeness
        # gates in the checksums job still execute on a *partial* draft. With the default behavior a
        # failed leg skips both jobs, leaving an incomplete-but-complete-looking draft with no
        # automated check between it and a manual "Publish" - the whole failure these gates exist to
        # catch. A missing SBOM/asset then fails the checksums job loudly instead of being skipped.
        if: ${{ !cancelled() }}
        # Pinned like the build matrix; `-latest` can silently jump an OS major mid-release.
        runs-on: ubuntu-26.04
        timeout-minutes: 30
        permissions:
            contents: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Install Rust toolchain
              # Pinned to match the build (keep in sync with rust-toolchain.toml).
              uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable (2026-06-30)
              with:
                  toolchain: 1.96.0

            # Pin the tool version (keep in sync when bumping), same reasoning as the cargo-audit /
            # cargo-deny pins in the audit job: an unpinned `cargo install` builds whatever the latest
            # release is at dispatch time, so the code executing on the runner is not what this
            # repository last reviewed.
            - name: Install cargo-cyclonedx
              run: cargo install cargo-cyclonedx@0.5.9 --locked

            # Generates the SBOM from the committed Cargo.lock (metadata only, no compile), then
            # uploads it to the draft *before* the checksums job runs, so its hash is covered by
            # SHA256SUMS.txt and its presence is enforced by that job's asset-completeness check.
            - name: Generate and upload the SBOM
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  cargo cyclonedx --manifest-path src-tauri/Cargo.toml --format json
                  # cargo-cyclonedx writes <crate>.cdx.json next to the manifest it processed; there
                  # is one package here. Locate it rather than hard-coding the derived name.
                  SBOM=$(find src-tauri -maxdepth 2 -name '*.cdx.json' | head -n1)
                  if [ -z "$SBOM" ]; then
                      echo "::error::cargo-cyclonedx produced no .cdx.json file" >&2
                      exit 1
                  fi
                  cp "$SBOM" "kavynex_${VERSION}_sbom.cdx.json"
                  gh release upload "v$VERSION" "kavynex_${VERSION}_sbom.cdx.json" --clobber

    checksums:
        name: Publish checksums
        needs: [publish-tauri, sbom]
        # Run on a partial draft too (see the SBOM job): a failed build leg must not skip the
        # asset-completeness and latest.json checks below - those are exactly what should turn a
        # partial release red with a list of what is missing, rather than being silently skipped.
        if: ${{ !cancelled() }}
        # Pinned like the build matrix; `-latest` can silently jump an OS major mid-release.
        runs-on: ubuntu-26.04
        timeout-minutes: 60
        permissions:
            contents: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            # Point every latest.json entry at the tagged download URL the updater will actually be
            # served from, rather than the api.github.com asset URL tauri-action writes.
            #
            # The reason it writes that one is real: while the release is a draft the tag is not
            # attached to it yet, so an asset's download URL carries an `untagged-<hash>` path
            # segment instead of `v<version>`. Baking that in would produce a manifest that breaks
            # the moment the release is published, so tauri-action uses the asset API URL, which is
            # stable across the transition. (tauri-action v0, which built v1.1.1, constructed the
            # tag URL instead - hence the difference from that release's manifest.)
            #
            # For this project the tag URL is the correct one regardless: the updater endpoint is
            # `releases/latest/download/latest.json`, which only ever resolves to a *published*
            # release, so no user reaches this manifest while it is still a draft. The api.github.com
            # form would also work on a public repo, but it moves the download onto a host with a
            # 60-request/hour unauthenticated rate limit and away from the one URL shape
            # verify-latest-json.js is written to accept - a gate that stays untouched here and
            # remains the authority: if this rewrite ever fails or targets the wrong repo, that
            # check fails the release.
            #
            # Runs before the checksums below so SHA256SUMS.txt covers the corrected file, and
            # before the verify step so it reads the corrected copy.
            - name: Rewrite latest.json to the tagged download URLs
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  mkdir assets
                  gh release download "v$VERSION" --dir assets

                  # id -> name for every asset on the draft, so each entry's URL is rebuilt from the
                  # asset it actually points at rather than from a guess about the filename. The id
                  # comes from the api URL's last segment, not gh's `.id`, which is a GraphQL node
                  # id and would match nothing.
                  gh release view "v$VERSION" --json assets \
                      --jq '[.assets[] | {id: (.apiUrl | split("/") | last), name}]' > asset-ids.json

                  node scripts/rewrite-latest-json-urls.js assets/latest.json asset-ids.json

                  gh release upload "v$VERSION" assets/latest.json --clobber

            # The updater artifacts are signed, but the installers downloaded manually
            # from the release page have no integrity reference without this file.
            - name: Generate and upload SHA256SUMS
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  (cd assets && sha256sum -- * > ../SHA256SUMS.txt)
                  cat SHA256SUMS.txt
                  gh release upload "v$VERSION" SHA256SUMS.txt --clobber

            # The four build legs upload to the draft independently (fail-fast is off), so a leg
            # that dies leaves a draft holding the other three - complete-looking, and one manual
            # "Publish" away from shipping a release with, say, no Windows installer. This job is
            # skipped entirely when a leg fails, so the only thing standing between that draft and
            # publication is the maintainer noticing the run is red. Name the expected set instead,
            # and fail loudly listing what is missing.
            #
            # Runs after the upload above so SHA256SUMS.txt is part of what gets checked.
            - name: Verify the draft has every expected asset
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  ASSETS=$(gh release view "v$VERSION" --json assets --jq '.assets[].name')
                  echo "$ASSETS"

                  # One entry per artifact the matrix is expected to produce, as a glob. The
                  # `.sig` files are the updater's; note the two .dmg files deliberately have
                  # none - tauri signs the macOS updater bundle (.app.tar.gz), not the disk image.
                  #
                  # Every name here is now confirmed against a real dispatch (v1.2.0), including the
                  # aarch64 ones this comment previously flagged as derived rather than observed:
                  # NSIS, WiX (MSI) and deb do use `arm64` while AppImage and rpm use `aarch64`, so
                  # those held. What did not hold was the pair that had been observed - the macOS
                  # `.app.tar.gz` names carried no version on v1.1.1 and carry one now, which is why
                  # they are built from ${VERSION} below. Treat the whole list as perishable: it
                  # tracks tauri's per-bundler naming, and this check exists precisely to fail loudly
                  # (echoing the real names above) rather than let a partial draft look complete.
                  MISSING=""
                  for pattern in \
                      "kavynex_${VERSION}_x64-setup.exe" \
                      "kavynex_${VERSION}_x64-setup.exe.sig" \
                      "kavynex_${VERSION}_x64_en-US.msi" \
                      "kavynex_${VERSION}_x64_en-US.msi.sig" \
                      "kavynex_${VERSION}_aarch64.dmg" \
                      "kavynex_${VERSION}_x64.dmg" \
                      "kavynex_${VERSION}_aarch64.app.tar.gz" \
                      "kavynex_${VERSION}_aarch64.app.tar.gz.sig" \
                      "kavynex_${VERSION}_x64.app.tar.gz" \
                      "kavynex_${VERSION}_x64.app.tar.gz.sig" \
                      "kavynex_${VERSION}_amd64.AppImage" \
                      "kavynex_${VERSION}_amd64.AppImage.sig" \
                      "kavynex_${VERSION}_amd64.deb" \
                      "kavynex_${VERSION}_amd64.deb.sig" \
                      "kavynex-${VERSION}-1.x86_64.rpm" \
                      "kavynex-${VERSION}-1.x86_64.rpm.sig" \
                      "kavynex_${VERSION}_arm64-setup.exe" \
                      "kavynex_${VERSION}_arm64-setup.exe.sig" \
                      "kavynex_${VERSION}_arm64_en-US.msi" \
                      "kavynex_${VERSION}_arm64_en-US.msi.sig" \
                      "kavynex_${VERSION}_aarch64.AppImage" \
                      "kavynex_${VERSION}_aarch64.AppImage.sig" \
                      "kavynex_${VERSION}_arm64.deb" \
                      "kavynex_${VERSION}_arm64.deb.sig" \
                      "kavynex-${VERSION}-1.aarch64.rpm" \
                      "kavynex-${VERSION}-1.aarch64.rpm.sig" \
                      "kavynex_${VERSION}_sbom.cdx.json" \
                      "latest.json" \
                      "SHA256SUMS.txt" \
                  ; do
                      if ! printf '%s\n' "$ASSETS" | grep -qxF "$pattern"; then
                          MISSING="$MISSING  $pattern\n"
                      fi
                  done

                  if [ -n "$MISSING" ]; then
                      echo "::error::The draft release v$VERSION is incomplete. Do not publish it."
                      # %b (not the variable-in-format-string the shell would otherwise flag) so the
                      # \n separators built into $MISSING are still expanded to real newlines.
                      printf 'Missing assets:\n%b' "$MISSING"
                      exit 1
                  fi

                  echo "The draft release v$VERSION has every expected asset."

            # README.md's Installation section is a third inventory of these same names, after the
            # completeness list above and the attestation's subject-path - and it was the only one
            # with nothing holding it. It is also the one a *user* reads to choose a download, so a
            # name that drifted there sends someone looking for a file the release page does not
            # serve, and an architecture that shipped without being added there is a download
            # nothing announces.
            #
            # Both halves already happened, around the same release. The macOS `.app.tar.gz` names
            # gained a version between v1.1.1 and v1.2.0 (see the completeness list's own comment on
            # treating these as perishable), and the Windows-on-ARM and Linux aarch64 installers
            # first shipped in v1.2.0 and had to be added to the README by hand afterwards.
            #
            # Checked against the assets the release actually carries rather than against the list
            # above, so a release where both lists drifted together - the case a cross-check between
            # them would pass - still fails here. Runs after the completeness check because that one
            # is the stronger signal: when installers are missing, the README is not the problem to
            # report first.
            - name: Verify the README documents this release's installers
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  gh release view "v$VERSION" --json assets --jq '.assets[].name' > release-assets.txt
                  node scripts/verify-readme-asset-names.js release-assets.txt

            # The check above proves latest.json is *present*, which is not the same as it being
            # complete. Every build leg merges its own entries into that one file on the release, so
            # a leg that uploaded its installer but lost the merge (a transient API error, two legs
            # racing) leaves a latest.json that parses fine and simply never offers an update to one
            # platform. Nothing else would notice: the file is there, the installers are there, and
            # only users on the missing platform would silently stop getting updates.
            #
            # Reads the copy the checksums step already downloaded, and checks the four keys the
            # updater actually looks up - tauri also emits `-app`/`-msi`/`-nsis`/`-appimage`/`-deb`/
            # `-rpm` variants, but the client resolves the bare `<os>-<arch>` one.
            - name: Verify latest.json offers every platform
              run: node scripts/verify-latest-json.js assets/latest.json