# Blank issues are off so a security report cannot be filed as one by accident: the two forms
# above both open with the "close this and open a private advisory" notice, and a blank issue
# would bypass it. The links below cover what is genuinely not a bug report.
blank_issues_enabled: false
contact_links:
    - name: Report a security vulnerability
      url: https://github.com/eduardoghi/kavynex/security/advisories/new
      about: >
          Privately, never as a public issue: a public one discloses it before there is a
          release that fixes it. See docs/THREAT-MODEL.md for the threat model it is assessed against.

    - name: Installation and troubleshooting
      url: https://github.com/eduardoghi/kavynex/blob/main/SUPPORT.md
      about: >
          Where to start, what to include in a report, and what to expect. Covers yt-dlp and
          FFmpeg not being found, a blank window on Windows, and a database reported corrupt.

    - name: Contributing
      url: https://github.com/eduardoghi/kavynex/blob/main/CONTRIBUTING.md
      about: Dev setup, the checks CI runs, and the commit conventions.
