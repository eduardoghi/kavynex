# cargo-deny configuration.
#
# Complements `cargo audit` (RUSTSEC vulnerability advisories) with the checks it does not do:
# license compliance, dependency source trust, and duplicate/wildcard dependencies. CI runs
# `cargo deny check licenses bans sources` (advisories stay with cargo-audit to avoid
# duplicating the same gate). See .github/workflows/ci.yml.

[graph]
# No `targets` filter: evaluate every crate in Cargo.lock across all platforms the app ships
# on, so a bad license in a platform-specific dependency is caught even on a different runner.

[licenses]
# Allowlist of the permissive licenses actually present in the tree (verified with
# `cargo deny check licenses`). No *strong* copyleft (GPL/LGPL/AGPL) is allowed, so a future
# dependency that pulls one in fails CI instead of silently shipping inside an MIT-licensed app. The
# underlying GTK/WebKit system libraries on Linux are (L)GPL C libraries linked dynamically - they
# are not Rust crates and never appear here; the Rust GTK bindings themselves are MIT.
#
# "Strong" is doing real work in that sentence, and it used to be missing. MPL-2.0 below *is*
# copyleft, so the blanket "no copyleft" this said before described a stricter policy than the list
# actually enforces - and a comment that overstates its own gate is worse than none, because the next
# reader trusts it. What MPL-2.0 obliges is file-scoped: the source of the covered files has to reach
# whoever receives the binary, with no claim on the rest of the app. This project publishes its
# entire source, so that is satisfied by construction rather than by anything the build does.
#
# Five crates arrive under it today, in two groups, neither of them a dependency this project chose:
# the Servo CSS stack behind the webview (`cssparser`, `cssparser-macros`, `selectors`,
# `dtoa-short`), reached through tauri, and `option-ext` via `dirs-sys`. Listed here so the entry is
# a recorded decision rather than something re-litigated each time somebody notices it.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "Unicode-3.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "CC0-1.0",
]
confidence-threshold = 0.9

[bans]
# Duplicate versions of a crate are common in a large transitive tree and not worth failing a
# release over, but surface them so the bloat/audit surface stays visible.
#
# "Surface" used to be doing no work in that sentence, and the same objection applies to it as to
# the licenses comment above: a `warn` writes to the log of a job that passes, and nobody opens the
# log of a green job. So the promise was kept by nothing for as long as it was written down. The
# "Report duplicate dependency versions" step in ci.yml and scheduled-audit.yml now renders the
# count and the offending crates into the run's step summary (scripts/summarize-cargo-deny-bans.js),
# which is where it is actually read. That step reports and never gates - changing this back to
# "deny" is still the only thing that would make a duplicate fail a build, and it is deliberately
# not what this line says.
multiple-versions = "warn"
# A wildcard ("*") version requirement in our own manifest would let an unreviewed major land
# silently; the app pins real ranges, so forbid it.
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# Every dependency must come from crates.io; one pulled from an arbitrary git host or a private
# registry fails, closing that supply-chain vector.
unknown-registry = "deny"
unknown-git = "deny"
