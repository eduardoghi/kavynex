# cargo-mutants configuration.
#
# Mutation testing for the security-critical Rust modules: cargo-mutants rewrites their logic
# (an inverted `starts_with`, a dropped `!`, an off-by-one, a swapped return) and fails if the
# existing tests still pass. That proves whether those tests actually kill logic mutants rather
# than merely covering the lines - line coverage on these files is already high, but coverage
# alone does not prove a bypass would be caught.
#
# Scoped to the modules whose regression cost is highest - path containment, the library-path
# guard, the yt-dlp host allow-list, and external-binary resolution - so the run stays inside the
# CI time budget. Widen `examine_globs` as the tests elsewhere earn the extra runtime; this is the
# Rust counterpart to Stryker (stryker.config.json), which only mutates the frontend.
#
# Run locally with:
#     cargo mutants --manifest-path src-tauri/Cargo.toml
# CI runs it on a weekly schedule (.github/workflows/mutation.yml); a surviving mutant makes
# cargo-mutants exit 2, which fails that run.

# Test *only* these files (globs are relative to this package root, src-tauri/).
#
# `src/services/filesystem.rs` - the atomic copy/replace primitives (whose job is to refuse to
# overwrite differing content and to restore the original when a replace fails) and the
# file-matching helpers. ADDED below after triaging its survivors.
#     Measured 2026-07-17 (`--no-config --file`): 121 mutants, 34 missed. Re-measured 2026-07-18 after
#     the symlink-cycle/temp-cleanup changes: 131 mutants, 43 missed. The matching helpers
#     (`find_latest_matching_file`, `find_unique_matching_file`, `find_best_matching_file`,
#     `clean_matching_files_in_dir`) held most of the killable ones - the existing preference test
#     picked the preferred file only because it was also the newest, so a flipped preference
#     comparison slipped through; the rest were prefix-named-subdirectory and non-directory cases the
#     filters guard but no test exercised. Those are now covered by tests. The remainder are excluded
#     below with a reason each: boundary functions (EXDEV detection, directory fsync), cfg-split
#     bodies, error-recovery branches a unit test cannot force, and equivalent mutants (a temp
#     filename the following rename discards, a guard that short-circuits to the same value, a `!=`
#     that only picks which line gets logged).
#
# `src/services/db_backup/mod.rs` - backup/restore/export/import, the most destructive operations
# in the app. ADDED below after triaging its survivors.
#     Measured 2026-07-19 (`--no-config --file`): 137 mutants, 14 missed. Most were off-by-one and
#     boundary checks the existing tests skirted: the restore/import schema-version gates (a `>=`
#     that would refuse a current-version backup or every normalized database), the backup-status
#     timestamp (a fixed sentinel vs the file's real mtime), the throttle constant, and the
#     apply-pending recovery guard (an `AND` weakened to `OR` would revert a leftover undo snapshot
#     on every launch). Those are now covered by tests. The remainder are excluded below: the
#     is_recent exact-second equality boundary (no deterministic input hits it) and the WAL-busy
#     import branch (needs a second connection holding a lock to force busy=1 with frames left,
#     which a unit test cannot arrange deterministically).
#   - `src/services/library_media.rs` and `src/services/library_cleanup.rs` - content-addressing
#     and the reference-count-before-unlink decision. ADDED below after a measured pass
#     (2026-07-18, cargo-mutants 27.1.0, `--in-place --no-config --file <each>`): 111 mutants, 94
#     unviable, 14 caught, and 3 initially missed - all three in `execute_plan`'s two early-return
#     branches (the empty-plan and library-unavailable reports), whose field population the tests
#     never asserted because that function needs a live `AppHandle`. Those branches were extracted
#     into the pure `report_for_nothing_deletable` / `report_for_unavailable_library` and covered,
#     so the glob goes in clean rather than red. (`--in-place` is needed to run cargo-mutants here
#     at all: the copy mode leaves the repo-root `../shared` parity fixture behind - see
#     mutation.yml.)
# `src/commands/live_chat.rs` - the one command module that re-implements the containment
# pattern (scope-to-live_chat/ plus symlink re-check) rather than delegating to library_guard,
# so its logic deserves the same mutation gate as the guard itself. ADDED after a measured pass
# (2026-07-20, `--in-place --no-config --file`): 32 mutants, 31 unviable (the AppHandle command
# glue does not build under mutation), 1 viable and caught - the unlink-rewording code gate,
# extracted into the pure `reword_unlink_error_after_reference_clear` so a test could pin it.
# `src/services/ssrf_guard.rs` - the pure IP-classification SSRF guard behind the thumbnail/avatar
# downloader (loopback/private/link-local/reserved, including IPv4-mapped/compatible and
# 6to4/NAT64/Teredo tunnel-embedded addresses). Extracted from `thumbnail_download.rs` into its own
# module so the classifier can be gated without dragging in the downloader's untestable async network
# code. ADDED after a measured pass (2026-07-21, `--in-place --no-config --file`): 73 mutants, 3
# unviable, 70 caught, 0 missed. The tunnel decoders were split into pure functions pinned by an
# exact-value test - that is what kills the shift/mask/XOR operator mutants a classification-only test
# had let survive, since many wrong octets still land in the same allow/deny band.
# `src/services/db_backup/import.rs`, `external.rs` and `integrity.rs` - the rest of the
# backup/restore/export/import/mirror machinery, the most destructive operations in the app. Joined
# to `mod.rs` (already in scope) by widening the entry to the directory glob `db_backup/*.rs`, so a
# future submodule split cannot silently fall out of scope. ADDED after a measured pass (2026-07-24,
# `--in-place --no-config --file <each>`): 108 mutants, 42 unviable, 49 caught, 17 missed. Five of the
# missed were the WAL-busy `stage_database_import` branch already excluded below; the rest were killed
# by new tests in the parent's `mod tests` - the live-chat import invariant's zero-violation and
# missing-`live_chat_file_path`-column cases, the intact-mirror no-clobber case, and the one-week
# integrity throttle - except the `run_full_integrity_check` operator survivors, which need a corrupt
# database returning a *controlled* number of problem rows and are excluded below.
# `src/services/yt_dlp_download/redaction.rs` - the argv redaction behind the `yt-dlp args: ...` line
# streamed to the in-app terminal. It is the only thing keeping the cookies-file path, the ffmpeg
# directory (which falls back to `<app_data_dir>/tools`, i.e. `C:\Users\<name>\AppData\...`), the
# `--paths` temp directory and the raw pasted URL out of a line users copy into public bug reports -
# pure logic with a privacy consequence, which is exactly what this gate is for. Extracted from
# `mod.rs` (the async orchestration a unit test cannot drive) rather than widening the glob to the
# whole directory, following the ssrf_guard.rs precedent. ADDED after a measured pass (2026-07-26,
# `--in-place --no-config --file` over it and command.rs together): 34 mutants, 6 unviable, 28
# caught, 0 missed - the existing argv test plus a new direct test for redact_paths_value's
# no-scope branch (which the argv test cannot reach, since build_download_command_args always
# emits the home:/temp: prefix) already kill every viable mutant.
# `is_valid_run_id` / `is_valid_format_id` moved into `command.rs` in the same change: they were
# defined in the ungated `mod.rs` while only `command.rs` used them, so no mutant was ever generated
# for the character-class filter that keeps the value after `-f` from being read as a yt-dlp flag.
# `src/services/yt_dlp_download/command.rs` - the pure yt-dlp download planning: request validation,
# the argv builder (with the `--` separator that stops the URL being read as a flag), and the
# terminal-outcome classifier - the command-injection defense-in-depth layer. ADDED after a measured
# pass (2026-07-24): 12 mutants, 5 unviable, 7 caught, 0 missed; its existing tests already kill every
# viable mutant. Scoped to `command.rs`, not the whole `yt_dlp_download` directory: `mod.rs` is the
# async process-spawning orchestration a unit test cannot drive (like the excluded binaries.rs
# boundary functions).
# `src/services/db_schema/*.rs` - the versioned migrations, the table-rebuild machinery and the
# schema introspection. This is the most destructive code in the app after db_backup: ensure_schema
# runs synchronously as the shared pool opens, so a migration that goes wrong does not degrade, it
# stops the app from opening at all - and the one real migration failure the project has had (the
# v8..v10 index built over a column v11 is what adds) was found by a user's database refusing to
# open, not by the suite. ADDED after a measured pass (2026-07-25, `--in-place --no-config --file
# <each>`): 106 mutants, 84 unviable, 15 caught, 7 missed. Six of the missed were the `> 0` guards
# that gate only a logger::warn line and are excluded below as equivalent; the seventh was the
# RebuildConnection Drop impl, which is now killed by a pair of tests asserting both directions of
# the detach-vs-return decision through the pool. Scoped by directory glob, like db_backup, so a
# future submodule split cannot silently fall out of scope.
# `src/services/pending_media.rs` and `src/services/library_recovery.rs` - the two crash-recovery
# modules that decide, on their own, whether to act on a leftover the previous run left behind.
# `marker_is_sweepable` is the reason: it gates the unlink of a media file the user may still want,
# and it is pure precisely so it can be gated here. This is also the file of the project's only real
# CRITICAL to date (a sweep that consumed markers belonging to creations still in flight, unlinking
# a video the user had just downloaded), so a regression here has a known, expensive shape.
# ADDED after a measured pass (2026-07-27, `--in-place --no-config --file <each>`):
#   pending_media.rs - 89 mutants, 48 unviable, 31 caught, 10 missed. One of the ten was a real gap
#   and is now covered by `an_unrelated_file_in_the_directory_is_never_read_as_a_marker`: weakening
#   the `||` in the entry filter to `&&` let a file with an unrelated name fall through and be parsed
#   as a marker, and what that function returns goes straight to a cleanup that unlinks files. The
#   module doc already claimed that property; nothing tested it above `is_marker_file_name`. The
#   other nine are excluded below in three groups, each for a different reason.
#   library_recovery.rs - 15 mutants, 1 unviable, 14 caught, 0 missed. Goes in clean.
# The four remaining pure security gates: every function that decides whether a caller-supplied
# value is allowed through, which is the profile this whole gate exists for. Each was already
# covered by unit tests; what was untested was whether those tests kill a logic mutant.
# ADDED after a measured pass (2026-07-27, `--in-place --no-config --file <each>`):
#   `src/services/yt_dlp_cookies.rs` - the `.txt` gate and the network-path refusal on the
#   `--cookies` argument, plus the browser allow-list that decides which cookie store yt-dlp is
#   allowed to read. 11 mutants, 0 unviable, 11 caught, 0 missed. Goes in clean.
#   `src/commands/security.rs` - `validate_asset_file_for_preview`, the only gate on the only
#   command that widens the asset scope to a caller-chosen file: a dropped `!` there turns
#   `allow_asset_file` into an arbitrary-file read through `convertFileSrc`. 32 mutants, 23
#   unviable (the AppHandle command glue does not build under mutation, as in live_chat.rs), 8
#   caught, 1 missed. The survivor was real and is now covered: `canonical != primary` in
#   `grant_path_with_canonical` had no test at all, and inverting it skips the canonical grant in
#   exactly the case the function exists for (the `\\?\` form convertFileSrc hands the scope on
#   Windows), which fails as every thumbnail and video silently not loading. Three tests now pin
#   both directions of that comparison and the documented propagate-primary/warn-on-canonical
#   asymmetry; re-measured at 9 caught, 0 missed.
#   `src/commands/database.rs` - `prepare_export_destination` / `prepare_import_source` and the
#   `destination_is_inside_dir` containment behind them, i.e. both directions of the gate on a
#   destructive overwrite. Measured with `--examine-re` scoped to those functions: 22 mutants, 16
#   unviable, 6 caught, 0 missed. The scoping is a runtime concession, not a narrower claim - a
#   full-file run generates ~35 further mutants that are all unviable command glue, and a partial
#   full-file pass confirmed the same 6 viable mutants and no survivor. The glob below is the whole
#   file regardless, matching live_chat.rs.
#   `src/utils/validation.rs` - the media title/type and channel name/handle validators every write
#   boundary calls. 31 mutants, 16 unviable, 15 caught, 0 missed. Goes in clean.
# `src/services/thumbnail_url.rs` - the host allow-list on the *direct* thumbnail fetch, the one
# branch of `download_thumbnail_from_url_async` that reaches the network without going through
# yt-dlp. It is what keeps that branch from being an outbound channel to any public host (the
# yt-dlp fallback has its own allow-list, in `yt_dlp_url.rs`, already in scope above). Extracted
# from `thumbnail_download.rs` rather than widening the glob to that file, following the
# `ssrf_guard.rs` and `yt_dlp_download/redaction.rs` precedent: the rest of that module is async
# process orchestration a unit test cannot drive, so a whole-file glob would report dozens of
# unkillable mutants and cost minutes per run. ADDED after a measured pass (2026-07-27,
# `--in-place --no-config --file`): 4 mutants, 0 unviable, 4 caught, 0 missed, in 85s - the three
# tests that moved with it (the real CDNs, the look-alike rejections, and the two-way CSP parity
# check) already kill every viable mutant. The runtime is the extraction's whole payoff.
examine_globs = [
    "src/services/pending_media.rs",
    "src/services/library_recovery.rs",
    "src/utils/path.rs",
    "src/services/library_guard.rs",
    "src/services/yt_dlp_url.rs",
    "src/services/binaries.rs",
    "src/services/library_media.rs",
    "src/services/library_cleanup.rs",
    "src/services/filesystem.rs",
    "src/services/db_backup/*.rs",
    "src/services/db_schema/*.rs",
    "src/services/yt_dlp_download/command.rs",
    "src/services/yt_dlp_download/redaction.rs",
    "src/services/ssrf_guard.rs",
    "src/services/thumbnail_url.rs",
    "src/services/yt_dlp_cookies.rs",
    "src/utils/validation.rs",
    "src/commands/live_chat.rs",
    "src/commands/security.rs",
    "src/commands/database.rs",
]

# Build and test against the committed Cargo.lock, matching every other cargo invocation in the
# project (ci.yml / release.yml all pass --locked) so a mutation run never silently re-resolves
# dependencies.
additional_cargo_args = ["--locked"]

# Skip mutants a unit test cannot deterministically kill, so the gate stays meaningful (a red run
# means a real gap) instead of perpetually red on things no test can pin. What stays in scope is
# the actual security logic: `sanitize_relative_path_strict` / `ensure_managed_library_relative_path`
# and the containment helpers, `is_allowed_youtube_url` / `is_allowed_youtube_host`, and
# `paths_refer_to_same_location` (the canonical-path comparison behind the library guard). Every
# exclusion below is a function whose behavior is a filesystem/process/env boundary, a
# cfg-split body cargo-mutants cannot evaluate, or an equivalent mutant.
exclude_re = [
    # pending_media.rs survivors (triaged 2026-07-27), in three groups.
    #
    # 1. `pin_process_start` exists to initialize a process-global OnceLock early, while the launch
    # instant is still accurate - if the sweep were the first caller half a minute in, every marker
    # written before that point would read as older than "process start" and become sweepable, which
    # is the bug it prevents. Deleting the call cannot be observed from a test: any test that reads
    # `process_start()` initializes the same OnceLock, and there is no second process to compare
    # against. Genuinely unkillable in-process rather than merely awkward.
    'replace pin_process_start with \(\)',
    # 2. The `ErrorKind::NotFound` arms. These are not just hard to force, they are unreachable:
    # `pending_media_dir` runs `create_dir_all` before returning, so the `read_dir` below never sees
    # a missing directory, and `clear_pending_media_artifacts` treats an already-removed marker as
    # success. Forcing a *different* io error (a permission denial) deterministically and
    # cross-platform is not something a unit test can arrange either.
    'error.kind\(\) == std::io::ErrorKind::NotFound.* in (read_pending_markers|clear_pending_media_artifacts)',
    'replace == with != in read_pending_markers',
    # 3. `sweep_pending_media_artifacts` is AppHandle/pool-bound glue: it needs a live handle and the
    # shared SQLite pool to reach the reference-counting cleanup, neither of which exists under the
    # unit-test harness. Excluded wholesale, like the binaries.rs boundary functions above, and for
    # the same reason. The decision that matters is not in it - `marker_is_sweepable` is, and it is
    # pure, in scope, and covered. Note the `||` filter in `read_pending_markers` is deliberately
    # *not* excluded: it is killed by
    # `an_unrelated_file_in_the_directory_is_never_read_as_a_marker`.
    'in sweep_pending_media_artifacts',
    # Boundary functions in binaries.rs: they read the process `PATH`, spawn `--version` health
    # checks, or resolve app directories from the `AppHandle`, none of which a unit test can pin
    # to a deterministic result on an arbitrary machine. `resolve_from_path` also matches
    # `resolve_from_path_var`, which is split into `#[cfg(windows)]` / `#[cfg(not(windows))]`
    # bodies: cargo-mutants does not evaluate cfg, so on any single platform the *other* body is
    # reported as an unkillable "missed" mutant (so it can never be green cross-platform). Its
    # actual no-CWD guarantee stays covered directly by the binaries.rs unit tests
    # (`resolve_from_path_var_only_searches_listed_directories` and the PATHEXT test).
    'is_executable_file',
    'resolve_from_path',
    'resolve_binary_from_candidates',
    'resolve_yt_dlp_binary',
    'resolve_ffmpeg_binary',
    'run_command_and_capture_first_line',
    'validate_yt_dlp_binary',
    'validate_ffmpeg_binary',
    'resolve_external_tools_status',
    # AppHandle/pool-bound guard entrypoints: they need the shared SQLite pool and settings row,
    # which do not exist under the unit-test harness (an AppHandle command cannot run there - the
    # pure comparison they delegate to, paths_refer_to_same_location, stays in scope and tested).
    'configured_library_dir',
    'ensure_configured_library_path',
    'verify_library_path_then_blocking',
    # Equivalent mutant: with `&&`, one empty input still returns false, because canonicalize("")
    # always errors and an empty string never equals a non-empty one, so the fallback compare
    # yields the same false. No input distinguishes it, so no test can kill it.
    'replace \|\| with && in paths_refer_to_same_location',
    # filesystem.rs boundary/cfg/equivalent survivors (triaged 2026-07-18; see the note above).
    # EXDEV detection is cfg-split (unix errno 18 / windows 17) and needs a real cross-device rename
    # to exercise; the name also matches the match-guard mutants in move_or_copy_file that call it.
    'is_cross_device_error',
    # Directory-entry fsync: cfg-split (unix File::sync_all / windows FlushFileBuffers), best-effort,
    # and its only effect - flushing the dir entry - is invisible to any functional test.
    'fsync_parent_dir',
    # Equivalent: with `&&`, a missing or non-file path still returns Ok(false), because the next
    # guard (or the hash of a non-file) yields the same result; the directory-vs-file case it defends
    # has no caller. Covers both the exists() and is_file() guards.
    'replace \|\| with && in file_paths_have_same_content',
    # Equivalent: only changes the internal temp filename, which the following rename discards.
    'delete ! in build_temp_destination_path',
    # The failed-rename recovery branch in copy_file_atomic, reachable only when the temp->dest
    # rename itself fails - which a unit test cannot force deterministically.
    'replace && with \|\| in copy_file_atomic',
    # The backup-vanished race branch in replace_file_safely: needs the destination to disappear
    # between the exists check and the rename, which no deterministic test can arrange.
    'error.kind\(\) == ErrorKind::NotFound.* in replace_file_safely',
    'replace == with != in replace_file_safely',
    # Equivalent: this `!=` gates only an eprintln diagnostic during migration - no observable change.
    'replace != with == in migrate_directory_contents',
    # The symlink-cycle test is cfg(unix) (creating a symlink on Windows needs privilege), so this
    # mutant survives only on a non-unix measurement; the ubuntu CI gate's unix test kills it. Its
    # `-> true` counterpart stays in scope (a plain copy test catches it on every platform).
    'replace dir_entry_is_symlink -> bool with false',
    # Equivalent: the ext guard in alternative_destination_path only differs from `true` when the
    # extension is an empty string, which Path::extension never yields (a trailing-dot name has no
    # extension). The `with false`/`delete !` variants are killed by the migration extension test.
    'replace match guard !ext.trim\(\).is_empty\(\) with true in alternative_destination_path',
    # db_backup/mod.rs survivors that no unit test can deterministically kill (triaged 2026-07-19).
    #
    # There used to be a `replace < with <= in is_recent` entry here, excluded because the throttle
    # boundary differs only when a file's age is exactly the interval to the second and a real clock
    # advancing between the set and the read never lets a test hit that. It is gone for two reasons,
    # both worth stating so it is not re-added: the comparison was extracted into the pure
    # `duration_is_recent(now, modified, interval)`, which takes `now` as an argument and can
    # therefore be handed the exact boundary; and `duration_is_recent_classifies_recent_stale_and_
    # backward_clock` now asserts that boundary, so the mutant is caught rather than excluded
    # (verified by applying it: the test fails on the `now - 60s` assertion). The entry also never
    # matched anything after the extraction - the mutant is named for `duration_is_recent`, and
    # `in is_recent` is not a substring of `in duration_is_recent`.
    #
    # The WAL-checkpoint "still in use" branch (busy != 0 && frames > 0): forcing a busy checkpoint
    # with frames left needs a second connection holding a lock on the source during the import,
    # which no deterministic unit test can arrange. The valid (busy == 0) path is exercised by the
    # import tests.
    'replace && with \|\| in stage_database_import',
    'replace != with == in stage_database_import',
    'replace > with (==|<|>=) in stage_database_import',
    # run_full_integrity_check (integrity.rs) survivors that need a corrupt database returning a
    # *controlled* number of problem rows, which no deterministic unit test can force. The
    # damaged-database test that exists returns a multi-row result, where these operators are
    # equivalent: `let ok = rows.len() == 1 && rows[0].0 == "ok"` would only be weakened by an `||`
    # when the pragma returns a *single* non-"ok" row (a corruption shape that cannot be produced on
    # demand), and `truncated: rows.len() > problems.len()` differs only when SQLite returns more than
    # MAX_INTEGRITY_PROBLEMS rows (again a specific, unforceable corruption). The one-week throttle
    # interval itself is not excluded - it is covered by
    # integrity_check_is_not_due_within_the_weekly_throttle_window.
    'replace && with \|\| in run_full_integrity_check',
    'replace > with (==|<|>=) in run_full_integrity_check',
    # db_schema/migrations.rs equivalents (triaged 2026-07-25). Both `> 0` guards gate nothing but a
    # logger::warn line reporting how many rows the migration repaired - the repair itself is the
    # UPDATE above, which runs unconditionally. Every mutation of the comparison changes only
    # whether that line is written, which no test can observe; same class as the migrate_directory_contents
    # `!=` excluded above. The repair counts themselves stay covered by the migration tests, which
    # assert the repaired rows rather than the log.
    'replace > with (==|<|>=) in apply_migration_13',
    'replace > with (==|<|>=) in apply_migration_14',
    # `is_batch_shim_extension` is `#[cfg(windows)]`, and so is the test that pins it. The gate runs
    # on ubuntu, where neither is compiled, so both directions of the mutant are reported missed on
    # every run and nothing on that platform can ever kill them. Same class, and the same reason, as
    # the `resolve_from_path_var` cfg-split exclusion above. The BatBadBut guard itself stays covered
    # by `is_batch_shim_extension_flags_only_bat_and_cmd`, which runs on Windows.
    'is_batch_shim_extension',
    # `current_version < N` weakened to `<= N` in ensure_schema re-runs the migration the database is
    # already at. Every migration is idempotent by construction - `CREATE TABLE/INDEX/TRIGGER IF NOT
    # EXISTS`, column-existence-guarded `ALTER`, and repairs that are plain `UPDATE ... WHERE` - and
    # each stamps the version it just re-applied, so the end state is byte-identical and only the
    # work is wasted. No assertion can distinguish it.
    #
    # The `== N` direction is deliberately NOT excluded. That one skips a migration outright, which
    # is a real defect, and it survived until 2026-07-28 because reaching head was the only thing
    # asserted - the later migrations stamp their version on the way past a skipped one, so the
    # database still ends at SCHEMA_VERSION while missing that migration's indexes.
    # `every_historical_version_migrates_to_the_current_schema` now asserts every index and trigger
    # in `INDEX_DDLS`/`TRIGGER_DDLS` exists after migrating from each historical version, which is
    # what kills it.
    'replace < with <= in ensure_schema',
]
