# cargo-mutants configuration.
#
# Mutation testing for the modules whose regression cost is highest. cargo-mutants rewrites their
# logic (an inverted `starts_with`, a dropped `!`, an off-by-one, a swapped return) and fails if the
# tests still pass. Coverage on these files is already high. This is what proves the tests kill a
# logic mutant rather than merely executing the line.
#
# This file is the configuration. The reasoning is in `docs/MUTATION-TESTING.md`, which covers
# how to widen the scope, the measured pass behind every glob below and the full triage behind
# every exclusion. Each exclusion here carries a one-line reason and a category (equivalent /
# boundary / cfg-split / AppHandle glue / caught-only-as-a-hang), and the argument for it is in
# that document.
#
# Run locally (`--in-place` is required, see the doc):
#     cargo mutants --manifest-path src-tauri/Cargo.toml --in-place
# CI runs it weekly (.github/workflows/mutation.yml). A surviving mutant exits 2 and fails the run.
#
# `scripts/verify-mutants-exclusions.js` fails CI when an `exclude_re` entry below stops matching
# any mutant. Two entries have already died silently after a pure extraction renamed the mutant they
# named, which is why that gate exists.

# Test *only* these files (globs are relative to this package root, src-tauri/). Adding one is a
# measured pass plus a row in docs/MUTATION-TESTING.md, never a glob on its own.
examine_globs = [
    "src/services/video_repository/media_page.rs",
    "src/services/live_chat_storage.rs",
    "src/services/thumbnail/redirect.rs",
    "src/services/media_protocol.rs",
    "src/services/library/migration.rs",
    "src/services/media_creation.rs",
    "src/services/thumbnail/picked.rs",
    "src/services/thumbnail/display.rs",
    "src/services/pending_media.rs",
    "src/services/library/recovery.rs",
    "src/utils/path.rs",
    "src/services/library/guard.rs",
    "src/services/yt_dlp/url.rs",
    "src/services/binaries.rs",
    "src/services/library/media.rs",
    "src/services/library/cleanup.rs",
    "src/services/filesystem.rs",
    "src/services/db_backup/*.rs",
    "src/services/db_schema/*.rs",
    "src/services/yt_dlp/download/command.rs",
    "src/services/thumbnail/download/process.rs",
    "src/services/yt_dlp/download/redaction.rs",
    "src/services/ssrf_guard.rs",
    "src/services/thumbnail/url.rs",
    "src/services/yt_dlp/cookies.rs",
    "src/utils/validation.rs",
    "src/commands/live_chat.rs",
    "src/commands/security.rs",
    "src/commands/database.rs",
    "src/services/library/verification.rs",
    "src/services/library/integrity.rs",
    "src/services/library/paths.rs",
    "src/utils/io.rs",
    "src/utils/format.rs",
    "src/error.rs",
]

# The one file the directory globs above pull in that this gate has nothing to say about. It holds
# the db_backup family's test fixtures, so a mutant in it can only make a fixture wrong, which is a
# red suite rather than the undetected regression this gate looks for. NOT MEASURED. See the doc.
exclude_globs = ["src/services/db_backup/test_support.rs"]

# Build and test against the committed Cargo.lock, matching every other cargo invocation in the
# project (ci.yml / release.yml all pass --locked) so a mutation run never silently re-resolves
# dependencies.
additional_cargo_args = ["--locked"]

# Mutants no unit test can deterministically kill, so the gate stays meaningful (a red run means a
# real gap) instead of perpetually red on things nothing can pin. Four categories, one reason each.
# The argument behind every entry is in docs/MUTATION-TESTING.md under "Exclusions".
#
# What stays in scope regardless is the security logic itself, namely sanitize_relative_path_strict,
# ensure_managed_library_relative_path and the containment helpers, is_allowed_youtube_url /
# is_allowed_youtube_host, paths_refer_to_same_location and network_paths_name_the_same_share.
exclude_re = [
    # Equivalent: gates only a logger::warn naming the leftovers. The removal already happened.
    'delete ! in remove_old_library_contents',
    # AppHandle glue: needs a live handle for the pool, the library and the cache directory. The
    # decisions were extracted into pure functions that are in scope and covered.
    'replace cleanup_artifacts_best_effort(_locked)? with \(\)',
    'replace record_marker_best_effort -> Option<String>',
    'replace clear_marker_best_effort with \(\)',
    # Equivalent: writes a logger::warn and nothing else. The bare name covers both the `with ()`
    # mutant and the failed_paths guard mutants, which are the same argument twice.
    'report_cleanup_outcome',
    # Equivalent: the `report.corrupt > 0` guard in front of a logger::warn. All three weakenings
    # return a byte-identical report. Only whether the line is written changes, and logger::write
    # returns early when LOG_PATH is unset, which is every unit test. Narrow on purpose. The rest of
    # verify_library_content_sync (the two cancel checks and the loop) stays in scope and is killed.
    'replace > with (==|<|>=) in verify_library_content_sync',
    # Boundary: spawns FFmpeg and polls it to a deadline. Note that nothing is excluded for
    # resolve_display_thumbnails_sync, and the doc records why the reason once given was wrong.
    'generate_display_thumbnail',
    'run_display_ffmpeg',
    # Boundary: the two halves of the thumbnail spawn that need a live child process, one to take
    # its pipes and one to kill its tree on a deadline. Narrow on purpose, since
    # read_drain_capped_async takes its cap as an argument and reads any AsyncRead, so it is tested
    # directly against a counting reader and stays in scope, which is where the cap arithmetic and
    # the drain-past-the-cap property actually live. build_thumbnail_command_args stays in scope
    # too.
    'replace wait_with_capped_output',
    'run_thumbnail_yt_dlp_with_timeout',
    # Equivalent: with `<=`, the extra iteration it admits is the one where buffer.len() equals
    # max_bytes, and there `max_bytes - buffer.len()` is 0, so the extend_from_slice copies nothing.
    # Same buffer, same drain, for the sync and the async drain alike. The sibling mutant on the
    # next line (`-` to `+`) is NOT excluded and is a real one. It overshoots the cap on the chunk
    # that straddles it, which a_stream_over_the_cap_is_truncated_but_still_drained_to_the_end and
    # a_drained_pipe_keeps_exactly_its_cap_and_is_read_to_the_end catch.
    'replace < with <= in read_drain_capped(_async)?$',
    # AppHandle glue: what is left once prepare_cache_scope_dirs took the observable half.
    # Narrow on purpose, and prepare_cache_scope_dirs, managed_cache_scope_dirs and
    # grant_path_with_canonical stay.
    'replace register_cache_asset_scope with \(\)',
    # Boundary: initializes a process-global OnceLock. Any test that reads it initializes the same
    # one, and there is no second process to compare against. Unkillable in-process.
    'replace pin_process_start with \(\)',
    # Boundary: unreachable rather than merely hard. pending_media_dir runs create_dir_all first, and
    # clear_pending_media_artifacts treats an already-removed marker as success.
    'error.kind\(\) == std::io::ErrorKind::NotFound.* in (read_pending_markers|clear_pending_media_artifacts)',
    'replace == with != in read_pending_markers',
    # AppHandle glue: needs the handle and the pool to reach the reference-counting cleanup. The
    # decision that matters (marker_is_sweepable) is pure, in scope and covered. The `||` filter in
    # read_pending_markers is deliberately NOT excluded.
    'in sweep_pending_media_artifacts',
    # Boundary: binaries.rs reads PATH, spawns --version health checks, or resolves app directories
    # from the AppHandle. resolve_from_path_var, which holds the no-CWD guarantee, stays in scope,
    # hence the anchor on its prefix.
    'is_executable_file',
    'resolve_from_path( |$)',
    'resolve_binary_from_candidates',
    'resolve_yt_dlp_binary',
    'resolve_ffmpeg_binary',
    'resolve_js_runtime',
    'run_command_and_capture_first_line',
    'validate_yt_dlp_binary',
    'validate_ffmpeg_binary',
    'resolve_external_tools_status',
    # AppHandle glue: guard entrypoints needing the pool and the settings row. The pure comparison
    # they delegate to (paths_refer_to_same_location) stays in scope and tested.
    'configured_library_dir',
    'ensure_configured_library_path',
    'verify_library_path_then_blocking',
    # AppHandle glue: resolves the configured library for a deletion. The decision it feeds,
    # ensure_library_reachable_for, takes a bool and stays in scope.
    'replace library_is_reachable -> bool',
    # Equivalent: with `&&`, one empty input still returns false, because canonicalize("") errors and
    # an empty string never equals a non-empty one.
    'replace \|\| with && in paths_refer_to_same_location',
    # cfg-split: EXDEV detection is unix errno 18 / windows 17. The name also matches the match-guard
    # mutants in move_or_copy_file that call it.
    'is_cross_device_error',
    # Equivalent: with `<=`, the extra iteration it admits is the one where buf.len() equals
    # max_bytes, and there `max_bytes - buf.len()` is 0, so the extend_from_slice copies nothing.
    # Same buffer, same line. The identical argument as the read_drain_capped_async entry above,
    # for the identical shape. Narrow on purpose. The sibling `-` to `+` mutants on the very next
    # line of each branch are NOT excluded, and are what the two chunked-reader tests were written
    # to kill.
    'replace < with <= in read_lossy_line_capped',
    # Equivalent: the same shape a third time, on the cookie-header probe. With `<=`, the extra
    # iteration reads into `probe[filled..]` when `filled` equals the buffer length, an empty
    # slice, which `read` answers with Ok(0) and the loop breaks on. Same bytes, same header check.
    # The `+=` siblings on the next line are NOT excluded.
    'replace < with <= in has_cookie_file_header',
    # Detected only as a hang, which cargo-mutants reports as a timeout rather than a kill. Each of
    # these stops the reader consuming what it just read, so `yt_dlp::metadata`'s
    # `while let Some(line) = read_lossy_line(..)` never terminates and the whole run sits until the
    # deadline. The suite does catch them. It just has no way to say so, and paying 300s apiece for
    # an answer already known is what the exclusion buys back.
    'replace read_lossy_line(_capped)? -> Option<String> with Some\(String::new\(\)\)',
    'replace \+ with [-*] in read_lossy_line_capped',
    # Host-killing, which is worse than the hang above and is why it hid for weeks. The other
    # `Some` spelling returns a line that is not empty and not JSON, so the same metadata loop
    # pushes it into `log_lines` on every pass without awaiting any I/O. Memory runs out in
    # seconds, well inside the 300s deadline, and the OOM takes the CI runner with it. That is
    # "the runner has received a shutdown signal" on shards 3 and 5 in every run since the
    # empty-string entry was written without this one (#55).
    'replace read_lossy_line(_capped)? -> Option<String> with Some\("xyzzy"\.into\(\)\)',
    # Host-killing the same way, in the live chat reader. A line that always reports one byte read
    # and no cut never reaches the end of the stream, so stream_reader_lines pushes an empty line
    # per pass until the 512 MiB ceiling, which memory does not survive. Shard 3 lost its runner
    # right after the mutant before it in the runs of 2026-10-12 and 2026-10-19 (#66).
    'replace read_capped_line -> std::io::Result<\(u64, bool\)> with Ok\(\(1, false\)\)',
    # cfg-split: the `\\?\` rewrite is a #[cfg(windows)] body with a #[cfg(not(windows))]
    # pass-through, so whichever platform runs the gate reports the other body as missed. The
    # Windows body is pinned by three cfg(windows) tests that run in the Windows test job. Narrow
    # on purpose, as library_input_path, which calls it, and every helper built on it stay in scope.
    'in to_extended_length_path',
    'replace to_extended_length_path -> PathBuf with Default::default\(\)',
    # cfg-split: unix File::sync_all / windows FlushFileBuffers, best effort, and flushing a
    # directory entry is invisible to any functional test.
    'fsync_parent_dir',
    # cfg-split: Windows and macOS bodies the Linux gate never compiles, named apart from the Linux
    # ones for this. flush_directory is Windows' directory flush. The uncached hash reads and the
    # reader they share are pinned by the cfg(windows) and cfg(macos) tests that compare them with a
    # plain hash in the Windows and macOS test jobs. resolve_from_path_var_windows is pinned by the
    # PATH tests there, the PATHEXT one included. The Linux uncached_file_hash and the non-Windows
    # resolve_from_path_var stay in scope.
    'flush_directory',
    'uncached_file_hash_(windows|macos|unsupported)',
    'hash_reader_or_give_up',
    'resolve_from_path_var_windows',
    # Boundary and cfg-split: the free space of the machine's own disk, statvfs on unix and
    # GetDiskFreeSpaceExW on windows. No test can pin the number. The decision it feeds,
    # has_room_for, stays in scope and covered.
    'available_space_bytes',
    # Equivalent: with no Range header the window asked for is `(0, len - 1)`, and clamp_range
    # bounds the end to `len - 1` anyway, so `len + 1` yields the same window.
    'replace - with \+ in plan_range',
    # Equivalent: `64 * 1024` is the size of each piece of a cut line read and dropped. At `64 + 1024`
    # the same bytes are dropped in more pieces, and the count and the next line are the same.
    'replace \* with \+ in read_capped_line',
    # Equivalent: `generations > 0` and `>= 0` differ only for zero generations, and the three
    # callers pass BACKUP_ROTATED_GENERATIONS (6), CORRUPT_ROTATED_GENERATIONS (2) and
    # EXTERNAL_BACKUP_ROTATED_GENERATIONS (2).
    'replace > with >= in rotate_generations',
    # Equivalent: the owner-write bit is only set once `readonly()` said no write bit is set at all,
    # so `mode ^ 0o200` and `mode | 0o200` give the same mode.
    'replace \| with \^ in make_owner_writable',
    # Equivalent: with `&&`, a missing or non-file path still returns Ok(false). Covers both guards.
    'replace \|\| with && in file_paths_have_same_content_using$',
    # Equivalent: changes only the internal temp filename, which the following rename discards.
    'delete ! in build_temp_destination_path',
    # Boundary: the failed-rename recovery branch, reachable only when the rename itself fails.
    'replace && with \|\| in copy_file_atomic_with$',
    # Boundary: the backup-vanished race needs the destination to disappear between the exists check
    # and the rename.
    'error.kind\(\) == ErrorKind::NotFound.* in replace_file_safely',
    'replace == with != in replace_file_safely',
    # Equivalent: gates only an eprintln diagnostic during migration.
    # cfg-split: the symlink-cycle test is cfg(unix). The `-> true` counterpart stays in scope.
    'replace dir_entry_is_symlink -> bool with false',
    # Equivalent: differs from `true` only for an empty extension, which Path::extension never
    # yields. The `with false` / `delete !` variants are killed by the migration extension test.
    # Boundary: the WAL-checkpoint "still in use" branch needs a second connection holding a lock on
    # the source during the import. The valid path is exercised by the import tests.
    'replace && with \|\| in stage_database_import',
    'replace != with == in stage_database_import',
    'replace > with (==|<|>=) in stage_database_import',
    # Equivalent against any forceable input, since distinguishing these needs a corrupt database
    # returning a controlled number of problem rows. The weekly throttle itself is NOT excluded.
    'replace && with \|\| in run_full_integrity_check',
    'replace > with (==|<|>=) in run_full_integrity_check',
    # Equivalent: both `> 0` guards gate only a logger::warn counting repaired rows. The repair is
    # the unconditional UPDATE above, and the counts stay covered by the migration tests.
    'replace > with (==|<|>=) in apply_migration_13',
    'replace > with (==|<|>=) in apply_migration_14',
    # cfg-split: #[cfg(windows)], and so is the test that pins it. The gate runs on ubuntu.
    'is_batch_shim_extension',
    # cfg-split: #[cfg(windows)], like the retry loop in retry_while_held that calls it, so neither
    # the function nor its match guard compiles on the ubuntu runner. One pattern covers both, since
    # the guard's mutants name the function in their description.
    'is_held_by_another_program',
    # Equivalent: re-runs a migration the database is already at, and every migration is idempotent,
    # so only the work is wasted. The `== N` direction is deliberately NOT excluded. That one skips
    # a migration outright, and it survived undetected until 2026-07-28. See the doc.
    'replace < with <= in needs_migration',
    # Dispatch glue. `handle` takes a UriSchemeContext and a responder, which only Tauri constructs
    # when it dispatches a request, and all it does is move the request to the blocking pool. What
    # it hands over, `serve`, takes a plain AppHandle and is in scope, authorization check included.
    'replace handle with \(\)',
]
