packages:
    - .

# Supply-chain hardening (https://pnpm.io/settings).
# Block transitive dependencies resolved from non-registry sources (git/tarball URLs).
# A legitimate dependency should always come from the registry.
blockExoticSubdeps: true

# Refuse to install any package version published less than 5 days ago, so a freshly
# compromised release is not picked up before the community can flag it. The committed
# lockfile is verified against this on every install. Five days matches Dependabot's cooldown
# (.github/dependabot.yml), so a dependency added by hand waits as long as one Dependabot bumps.
minimumReleaseAge: 7200

# Every entry below is a **floor, not a pin**. An exact version here raises the minimum today and
# freezes the package after that. Nothing can bump past an override, so Dependabot opens no PR, and
# `scripts/check-js-advisories.js` sees only the resolved tree, which has no *open* advisory because
# the override pinned it. The next advisory on the same package then goes unreported. A `>=` raises
# the minimum and still lets later patches in.
#
# A floor does not move the lockfile by itself. After raising one, run `pnpm install` so the tree
# resolves the patched version.
#
# Each carries the condition under which it should be deleted rather than being left to accumulate.
overrides:
    # Floors the transitive qs past CVE-2026-8723, a DoS where qs.stringify throws a TypeError on
    # null/undefined entries in comma-format arrays when encodeValuesOnly is set (>=6.11.1 <6.15.2).
    # Dev/build scope like fast-uri below, never shipped in the app.
    #
    # REMOVE WHEN: every dependent's own range already floors qs at 6.15.2 or later. Check with
    # `pnpm why qs`, and confirm by deleting this line and seeing what `pnpm install` resolves.
    qs: ">=6.15.2"
    # Floors the transitive fast-uri, pulled by ajv, which only Stryker brings in (dev scope, never
    # shipped in the app). 3.1.9 fixes GHSA-w74x-v6f9-j3xg, GHSA-xhq7-xmqj-769h,
    # GHSA-wjr9-j795-jxcr and GHSA-333x-w4r6-6crp, along with the host confusion and SSRF ones fixed
    # in 3.1.4 to 3.1.6. Bounded to the 3.x line ajv declares, so the override stays a patch rather
    # than a major ajv has not been tested against.
    #
    # REMOVE WHEN: ajv's own range floors fast-uri at 3.1.9 or later.
    fast-uri: ">=3.1.9 <4"
    # Floors the transitive minimatch, pulled by ESLint, typescript-eslint and Stryker (dev scope,
    # never shipped in the app), past GHSA-g3hv-75wg-m249, a DoS through a glob pattern that grows
    # during preprocessing. The fix exists only in 11.x, a major none of the three declares yet, which
    # is why Dependabot could not raise it. 11 removed `makeRe`, `regexp`, `matchOne` and the `AST`
    # class, and the three only call `minimatch()` and `new Minimatch` with `match` and `hasMagic`,
    # which it kept. Bounded to 11.x for the same reason fast-uri is bounded to 3.x.
    #
    # REMOVE WHEN: `pnpm why minimatch` shows every dependent declaring 11.0.1 or later itself.
    minimatch: ">=11.0.1 <12"
